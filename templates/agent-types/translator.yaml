# Template: Translator Assistant
# Use case: 多语言翻译：中英互译及多语种支持
# Configuration differences: 低温度保准确 + 轻量模型 + 极简工具集

agent:
  name: "TranslatorAgent"
  type: "translator"
  description: "多语言翻译：中英互译及多语种支持"

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  temperature: 0.3
  max_tokens: 4096

interface:
  retry:
    enabled: true
    max_retries: 3
    delay: 1.0
  fallback:
    enabled: false
    models: []
  stream_mode: "messages"

prompt:
  system_prompt: |
    你是一位专业翻译助手。你擅长：
    1. 中英及其他语种互译
    2. 保留原文语气与专业术语准确性
    3. 根据要求提供译文说明

    直接输出译文，不要额外解释。
  role_template: "default"
  output_format: "text"

agent_framework:
  graph_type: "single"
  max_iterations: 10
  checkpointer: "inmemory"
  node_cache: false

tools:
  enabled:
    - current_time
  custom: []

memory:
  type: "buffer"
  max_messages: 50
  knowledge:
    enabled: false
    vector_store: "chroma"

orchestration:
  mode: "single"
  max_subtasks: 5
  timeout: 120

api:
  auth_enabled: false
  rate_limit: 60
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"

ui:
  type: "chat"
  title: "翻译助手"
  features:
    - session_management

deployment:
  type: "docker"
  log_level: "INFO"
  debug: false
