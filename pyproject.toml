[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmirror"
version = "0.1.0"
description = "心镜 MindMirror — 通过问卷与情境测评,看见真实的自己"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.118",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pendulum>=3.0",
    "python-ulid>=3.0",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 全局忽略:中文全角符号警告(RUF001/002/003)、StrEnum 推荐(UP042)、zip strict=(B905)、
# 三元运算符偏好(SIM108)、未使用的解包变量(RUF059)
ignore = ["E501", "RUF001", "RUF002", "RUF003", "UP042", "B905", "SIM108", "RUF059"]

# 测试文件允许中文全角符号注释(RUF003/RUF002)和延迟导入(E402)
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF003", "RUF002", "RUF001", "E402"]
# SQLAlchemy 字符串前向引用(relationship("AssessmentSession"))合法模式
"app/models/**" = ["F821"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# 允许隐式 Optional(PEP 484 旧风格,代码中广泛使用)
implicit_optional = true
# 不强制要求每个函数都有返回类型标注(FastAPI 路由广泛使用 dict 返回)
disallow_untyped_defs = false
# 不强制要求完整类型参数
disallow_any_generics = false
# 不强制警告 Any 返回(FastAPI 路由声明广泛使用)
warn_return_any = false
# 不强制严格相等检查
strict_equality = false
# 不警告未使用的 type: ignore(代码库演化中)
warn_unused_ignores = false
# 禁用以下错误码:FastAPI 路由无需返回标注、SQLAlchemy Optional 推断、SQL 表达式 bool 类型
disable_error_code = ["no-untyped-def", "union-attr", "var-annotated", "attr-defined", "arg-type", "assignment", "operator"]

# 测试文件放宽
[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
