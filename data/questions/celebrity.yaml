  # ===== 补足困境题(再加深历史回响) =====
  - id: c_d15
    type: dilemma
    prompt: 你坚信地动说,权威判你重刑,只要公开认错就能活命。
    dimensions: [idealism, openness, risk_taking]
    time_limit_sec: 15
    scenario: 你以理性确信日心说,但权威定性为异说。认错可活,但意味着背叛真理;坚持则被处死。
    options:
      - {id: a, text: 坚持真理,从容赴死, scores: {idealism: 2, openness: 2, risk_taking: 2}, tag: courage}
      - {id: b, text: 表面认错,内心坚守, scores: {idealism: 1, openness: 1, risk_taking: 0}, tag: pragmatic}
      - {id: c, text: 公开认错,保命要紧, scores: {idealism: -2, openness: -1, risk_taking: -2}, tag: avoidance}
    historical_figure: 布鲁诺
    historical_choice: a
  - id: c_d16
    type: dilemma
    prompt: 你的变法已见成效,但旧贵族暗中布局,新君即位后清算在即。
