  # ===== 扩展困境题 II(全新历史名人困境) =====
  - id: c_d9
    type: dilemma
    prompt: 你的观测证实颠覆性天文发现,正统权威命你公开否认、放弃学说。
    dimensions: [idealism, risk_taking, openness]
    time_limit_sec: 15
    scenario: 你的望远镜看清了天体运行真相,与当时主流学说相悖。妥协可保命、私下继续研究;坚持则可能被严厉处置或终身监禁,学说或随你湮灭。
    options:
      - {id: a, text: 表面妥协,私下续研, scores: {idealism: 1, risk_taking: 0, openness: 1}, tag: pragmatic}
      - {id: b, text: 坚持不改,坦然受刑, scores: {idealism: 2, risk_taking: 2, openness: 2}, tag: courage}
      - {id: c, text: 彻底放弃,安度余生, scores: {idealism: -2, risk_taking: -2, openness: -1}, tag: avoidance}
    historical_figure: 伽利略
    historical_choice: a
  - id: c_d10
    type: dilemma
    prompt: 你因直言触怒君主,死刑当前,可受辱免死,但史书未成。
    dimensions: [idealism, conscientiousness, risk_taking]
    time_limit_sec: 15
    scenario: 你正撰写一部空前史书,功亏一篑。赎命则倾家荡产,受辱则奇耻大辱,宁死则毕生心血湮灭。
    options:
      - {id: a, text: 忍辱负重,完成史书, scores: {idealism: 2, conscientiousness: 2, risk_taking: 1}, tag: courage}
      - {id: b, text: 倾家赎命,保全体面, scores: {idealism: 0, conscientiousness: 1}, tag: pragmatic}
      - {id: c, text: 宁死不受辱, scores: {idealism: 1, conscientiousness: -1, risk_taking: 2}, tag: courage}
    historical_figure: 司马迁
    historical_choice: a
  - id: c_d11
    type: dilemma
    prompt: 你主持变法,核心政策能富国强兵,但满朝反对、百姓怨声载道。
    dimensions: [idealism, risk_taking, agreeableness]
    time_limit_sec: 15
    scenario: 新政利在长远,却触犯既得利益、短期阵痛剧烈。坚持恐乱国,退让则功亏一篑。
    options:
      - {id: a, text: 力排众议,坚持变法, scores: {idealism: 2, risk_taking: 2, agreeableness: -1}, tag: courage}
      - {id: b, text: 暂缓推进,先求共识, scores: {idealism: 1, risk_taking: 0, agreeableness: 1}, tag: pragmatic}
      - {id: c, text: 顺从众议,放弃新政, scores: {idealism: -2, risk_taking: -2, agreeableness: 1}, tag: avoidance}
    historical_figure: 王安石
    historical_choice: a
  - id: c_d12
    type: dilemma
    prompt: 你兵败被俘,敌国许以高官劝降,旧友故旧纷纷仕敌。
    dimensions: [idealism, conscientiousness, risk_taking]
    time_limit_sec: 15
    scenario: 降则荣华富贵、与故旧同列;拒则必死,但气节留名青史。你的家人也在敌营,生死系你一念。
    options:
      - {id: a, text: 拒降赴死, scores: {idealism: 2, conscientiousness: 2, risk_taking: 2}, tag: courage}
      - {id: b, text: 假降图谋复国, scores: {idealism: 0, risk_taking: 1}, tag: pragmatic}
      - {id: c, text: 降顺求存, scores: {idealism: -2, conscientiousness: -2, risk_taking: -2}, tag: avoidance}
    historical_figure: 文天祥
    historical_choice: a
  - id: c_d13
    type: dilemma
    prompt: 上级命你禁绝泛滥的有害贸易,幕后是强大对手,禁则可能引发冲突。
    dimensions: [idealism, risk_taking, conscientiousness]
    time_limit_sec: 15
    scenario: 有害贸易祸国殃民,你手握禁令。雷厉风行可能招致强力反扑、让你沦为替罪羊;放任则国民沉沦。
    options:
      - {id: a, text: 雷厉风行禁绝,承担冲突, scores: {idealism: 2, risk_taking: 2, conscientiousness: 2}, tag: courage}
      - {id: b, text: 缓禁设限,周旋各方, scores: {idealism: 1, risk_taking: 0}, tag: pragmatic}
      - {id: c, text: 阳奉阴违,保身为主, scores: {idealism: -2, risk_taking: -2}, tag: avoidance}
    historical_figure: 林则徐
    historical_choice: a
  - id: c_d14
    type: dilemma
    prompt: 你的群体面临不公对待,激烈对抗或速决但代价沉重,温和坚持见效慢且被讥软弱。
    dimensions: [idealism, agreeableness, risk_taking]
    time_limit_sec: 15
    scenario: 你深知温和坚持需承受压力、牺牲巨大,且对方不会轻易让步。激烈对抗或能快速破局,却与你信念相悖。
    options:
      - {id: a, text: 坚持温和,承受压力, scores: {idealism: 2, agreeableness: 2, risk_taking: 1}, tag: courage}
      - {id: b, text: 激烈对抗,快速破局, scores: {idealism: 1, agreeableness: -2, risk_taking: 2}, tag: courage}
      - {id: c, text: 妥协谈判,求得改善, scores: {idealism: -1, agreeableness: 1, risk_taking: -1}, tag: pragmatic}
    historical_figure: 甘地
    historical_choice: a

