      - {id: b, text: 据理力争,寻求转机, scores: {idealism: 1, risk_taking: 1, conscientiousness: 2}, tag: pragmatic}
      - {id: c, text: 出奔他国,留待时机, scores: {idealism: -1, risk_taking: -1, conscientiousness: 0}, tag: avoidance}
    historical_figure: 商鞅
