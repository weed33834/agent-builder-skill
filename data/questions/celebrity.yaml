# 名人镜 —— 你与历史上哪个名人最相近
# 维度:大五人格 + 风险偏好 + 理想主义
# 量表12 + 困境10 + 资源分配3 + 排序4 + 滑块1 + 强迫抉择1 + 矩阵1 + 拍卖1 = 34题
# (含困境/分配扩展后:量表24 + 困境16 + 分配6 + 排序4 + 各1 = 54题)
assessment_type: celebrity
title: 名人镜
description: 通过回答与历史名人真实困境相似的选择,测出你与谁最相近。
estimated_minutes: 25
dimensions:
  - openness
  - conscientiousness
  - extraversion
  - agreeableness
  - neuroticism
  - risk_taking
  - idealism
questions:
  # ===== 量表题(人格基础) =====
  - id: c_s1
    type: scale
    prompt: 面对未知的新事物,你通常的第一反应是?
    dimensions: [openness]
    points:
      - {id: "1", text: 警惕回避, scores: {openness: -2}}
      - {id: "2", text: 观望一下, scores: {openness: -1}}
      - {id: "3", text: 看情况, scores: {openness: 0}}
      - {id: "4", text: 想了解, scores: {openness: 1}}
      - {id: "5", text: 主动探索, scores: {openness: 2}}
  - id: c_s2
    type: scale
    prompt: 你做计划后,多大程度上会严格执行?
    dimensions: [conscientiousness]
    points:
      - {id: "1", text: 几乎不, scores: {conscientiousness: -2}}
      - {id: "2", text: 偶尔, scores: {conscientiousness: -1}}
      - {id: "3", text: 一半一半, scores: {conscientiousness: 0}}
      - {id: "4", text: 多数会, scores: {conscientiousness: 1}}
      - {id: "5", text: 严格, scores: {conscientiousness: 2}}
  - id: c_s3
    type: scale
    prompt: 在人群中,你更倾向于?
    dimensions: [extraversion]
    points:
      - {id: "1", text: 沉默观察, scores: {extraversion: -2}}
      - {id: "2", text: 偶尔发言, scores: {extraversion: -1}}
      - {id: "3", text: 看氛围, scores: {extraversion: 0}}
      - {id: "4", text: 主动参与, scores: {extraversion: 1}}
      - {id: "5", text: 主导话题, scores: {extraversion: 2}}
  - id: c_s4
    type: scale
    prompt: 别人求助时,你的第一反应?
    dimensions: [agreeableness]
    points:
      - {id: "1", text: 先想成本, scores: {agreeableness: -2}}
      - {id: "2", text: 看关系, scores: {agreeableness: -1}}
      - {id: "3", text: 视情况, scores: {agreeableness: 0}}
      - {id: "4", text: 倾向帮, scores: {agreeableness: 1}}
      - {id: "5", text: 毫不犹豫, scores: {agreeableness: 2}}
  - id: c_s5
    type: scale
    prompt: 遇到突发坏消息,你的情绪反应?
    dimensions: [neuroticism]
    points:
      - {id: "1", text: 平静应对, scores: {neuroticism: -2}}
      - {id: "2", text: 略有波动, scores: {neuroticism: -1}}
      - {id: "3", text: 正常反应, scores: {neuroticism: 0}}
      - {id: "4", text: 明显焦虑, scores: {neuroticism: 1}}
      - {id: "5", text: 难以平复, scores: {neuroticism: 2}}
  - id: c_s6
    type: scale
    prompt: 面对高风险高回报的机会,你?
    dimensions: [risk_taking]
    points:
      - {id: "1", text: 坚决回避, scores: {risk_taking: -2}}
      - {id: "2", text: 谨慎考虑, scores: {risk_taking: -1}}
      - {id: "3", text: 看概率, scores: {risk_taking: 0}}
      - {id: "4", text: 愿意尝试, scores: {risk_taking: 1}}
      - {id: "5", text: 主动追求, scores: {risk_taking: 2}}
  - id: c_s7
    type: scale
    prompt: 当原则与现实利益冲突,你?
    dimensions: [idealism]
    points:
      - {id: "1", text: 务实优先, scores: {idealism: -2}}
      - {id: "2", text: 利益为主, scores: {idealism: -1}}
      - {id: "3", text: 权衡, scores: {idealism: 0}}
      - {id: "4", text: 倾向原则, scores: {idealism: 1}}
      - {id: "5", text: 原则至上, scores: {idealism: 2}}
  - id: c_s8
    type: scale
    prompt: 你对既有权威和传统的态度?
    dimensions: [openness, idealism]
    points:
      - {id: "1", text: 尊重服从, scores: {openness: -1, idealism: -1}}
      - {id: "2", text: 谨慎接受, scores: {openness: 0, idealism: 0}}
      - {id: "3", text: 独立判断, scores: {openness: 1, idealism: 1}}
      - {id: "4", text: 质疑挑战, scores: {openness: 2, idealism: 1}}
      - {id: "5", text: 颠覆重构, scores: {openness: 2, idealism: 2}}

  # ===== 困境题(历史名人真实困境) =====
  - id: c_d1
    type: dilemma
    prompt: 你发现上司在挪用公款,但 ta 是你恩人,且举报会让你失业。
    dimensions: [idealism, risk_taking]
    time_limit_sec: 15
    scenario: 你在财务岗,发现一笔异常转账指向上司。ta 三年前在你母亲重病时借款救急。举报意味着你失业,且对方可能反咬。
    options:
      - {id: a, text: 匿名举报,承担失业风险, scores: {idealism: 2, risk_taking: 2}, tag: courage}
      - {id: b, text: 私下劝退,给对方退路, scores: {idealism: 1, risk_taking: 0}, tag: pragmatic}
      - {id: c, text: 装作没看见,保住工作, scores: {idealism: -2, risk_taking: -1}, tag: avoidance}
    historical_figure: 林肯
    historical_choice: a
  - id: c_d2
    type: dilemma
    prompt: 你有一项颠覆性发明,公开会推动人类进步但会让你的公司破产。
    dimensions: [idealism, openness]
    time_limit_sec: 15
    scenario: 你的发明能解决能源危机,但公开后你公司核心业务将归零,数千员工失业。
    options:
      - {id: a, text: 公开发明,接受公司破产, scores: {idealism: 2, openness: 2}, tag: courage}
      - {id: b, text: 内部转型,缓慢过渡, scores: {idealism: 0, openness: 1}, tag: pragmatic}
      - {id: c, text: 封存专利,保住公司, scores: {idealism: -2, openness: -1}, tag: avoidance}
    historical_figure: 居里夫人
    historical_choice: a
  - id: c_d3
    type: dilemma
    prompt: 战争中你掌握情报,救一群平民会让你的潜伏身份暴露,导致更多同胞牺牲。
    dimensions: [idealism, risk_taking]
    time_limit_sec: 15
    scenario: 你是卧底。一个村庄即将被屠,你出手能救 200 人,但身份暴露后 5000 人计划失败。
    options:
      - {id: a, text: 出手救眼前 200 人, scores: {idealism: 1, risk_taking: 2}, tag: courage}
      - {id: b, text: 隐忍,保 5000 人计划, scores: {idealism: 0, risk_taking: -1}, tag: avoidance}
      - {id: c, text: 试图两全,冒险传递情报, scores: {idealism: 2, risk_taking: 1}, tag: pragmatic}
    historical_figure: 辛德勒
    historical_choice: a
  - id: c_d4
    type: dilemma
    prompt: 你的理论会被当时主流视为异说,发表可能身败名裂但真理在你这边。
    dimensions: [openness, idealism, risk_taking]
    time_limit_sec: 15
    scenario: 你发现一个颠覆性事实,但公开会触怒权威机构,可能被排挤、孤立。沉默则安稳一生。
    options:
      - {id: a, text: 公开发表,承担一切, scores: {openness: 2, idealism: 2, risk_taking: 2}, tag: courage}
      - {id: b, text: 私下流通,等待时机, scores: {openness: 1, idealism: 1, risk_taking: 0}, tag: pragmatic}
      - {id: c, text: 永不发表,保全自身, scores: {openness: -1, idealism: -1, risk_taking: -2}, tag: avoidance}
    historical_figure: 达尔文
    historical_choice: a
  - id: c_d5
    type: dilemma
    prompt: 你能通过权谋登上高位,代价是背叛信任你的盟友。
    dimensions: [agreeableness, idealism, risk_taking]
    time_limit_sec: 15
    scenario: 机遇出现:算计盟友可独揽大权,实现你的宏大蓝图。但盟友曾为你两肋插刀。
    options:
      - {id: a, text: 算计盟友,实现蓝图, scores: {agreeableness: -2, idealism: 1, risk_taking: 2}, tag: courage}
      - {id: b, text: 放弃机遇,守盟约, scores: {agreeableness: 2, idealism: 1, risk_taking: -1}, tag: courage}
      - {id: c, text: 试图兼顾,风险最大, scores: {agreeableness: 1, idealism: 0, risk_taking: 1}, tag: pragmatic}
    historical_figure: 拿破仑
    historical_choice: a
  - id: c_d6
    type: dilemma
    prompt: 法庭判你死刑,给你逃跑机会,但你一直教导"遵守法律"。
    dimensions: [idealism, conscientiousness, risk_taking]
    time_limit_sec: 15
    scenario: 朋友买通狱卒安排你出逃。逃则生,但你毕生宣讲"守法即美德",逃跑将让信念崩塌。
    options:
      - {id: a, text: 拒绝逃跑,从容赴死, scores: {idealism: 2, conscientiousness: 2, risk_taking: 1}, tag: courage}
      - {id: b, text: 出逃后继续传播思想, scores: {idealism: 1, conscientiousness: -1, risk_taking: 2}, tag: courage}
      - {id: c, text: 服从判决但留辩词, scores: {idealism: 1, conscientiousness: 1, risk_taking: 0}, tag: pragmatic}
    historical_figure: 苏格拉底
    historical_choice: a

  # ===== 资源分配题(量化价值优先级) =====
  - id: c_a1
    type: allocation
    prompt: 你有一笔奖金,如何分配?
    dimensions: [agreeableness, conscientiousness, openness, idealism]
    targets:
      - {id: family, text: 家人, scores: {agreeableness: 1}}
      - {id: self_learn, text: 自我提升(书/课), scores: {openness: 1, conscientiousness: 1}}
      - {id: donate, text: 捐赠弱势, scores: {idealism: 1, agreeableness: 1}}
      - {id: save, text: 储蓄, scores: {conscientiousness: 1}}
    total: 100
  - id: c_a2
    type: allocation
    prompt: 你的一周时间(100 单位)如何分配?
    dimensions: [extraversion, openness, conscientiousness, neuroticism]
    targets:
      - {id: social, text: 社交聚会, scores: {extraversion: 1}}
      - {id: solo_explore, text: 独自探索新事物, scores: {openness: 1}}
      - {id: work_plan, text: 按计划工作, scores: {conscientiousness: 1}}
      - {id: rest, text: 休息放空, scores: {neuroticism: 1}}
    total: 100

  # ===== 扩展量表题(深化维度) =====
  - id: c_s9
    type: scale
    prompt: 当你听说一种与你截然相反的观点,你?
    dimensions: [openness]
    points:
      - {id: "1", text: 本能抵触, scores: {openness: -2}}
      - {id: "2", text: 不愿了解, scores: {openness: -1}}
      - {id: "3", text: 看心情, scores: {openness: 0}}
      - {id: "4", text: 愿意倾听, scores: {openness: 1}}
      - {id: "5", text: 主动求教, scores: {openness: 2}}
  - id: c_s10
    type: scale
    prompt: 任务截止前一周,你通常的状态?
    dimensions: [conscientiousness, neuroticism]
    points:
      - {id: "1", text: 已完成大半, scores: {conscientiousness: 2, neuroticism: -1}}
      - {id: "2", text: 稳步推进, scores: {conscientiousness: 1}}
      - {id: "3", text: 还没开始, scores: {conscientiousness: 0}}
      - {id: "4", text: 焦虑赶工, scores: {conscientiousness: -1, neuroticism: 1}}
      - {id: "5", text: 通宵硬扛, scores: {conscientiousness: -2, neuroticism: 2}}
  - id: c_s11
    type: scale
    prompt: 在一个全是陌生人的场合,你离开时的感受?
    dimensions: [extraversion, neuroticism]
    points:
      - {id: "1", text: 精疲力竭, scores: {extraversion: -2, neuroticism: 1}}
      - {id: "2", text: 略感疲惫, scores: {extraversion: -1}}
      - {id: "3", text: 还好, scores: {extraversion: 0}}
      - {id: "4", text: 意犹未尽, scores: {extraversion: 1}}
      - {id: "5", text: 焕发活力, scores: {extraversion: 2, neuroticism: -1}}
  - id: c_s12
    type: scale
    prompt: 当身边的人陷入负面情绪,你?
    dimensions: [agreeableness, neuroticism]
    points:
      - {id: "1", text: 跟着低落, scores: {agreeableness: 1, neuroticism: 2}}
      - {id: "2", text: 想躲开, scores: {agreeableness: -1, neuroticism: 1}}
      - {id: "3", text: 理性对待, scores: {agreeableness: 0, neuroticism: -1}}
      - {id: "4", text: 安慰陪伴, scores: {agreeableness: 1, neuroticism: -1}}
      - {id: "5", text: 主动分担, scores: {agreeableness: 2, neuroticism: -2}}

  # ===== 扩展困境题(更深的历史回响) =====
  - id: c_d7
    type: dilemma
    prompt: 你能拯救一项濒危的文化遗产,但需耗尽半生精力且无回报。
    dimensions: [idealism, conscientiousness, risk_taking]
    time_limit_sec: 15
    scenario: 一项古老技艺即将失传,只有你愿意学。学成需二十年,无市场、无传承资金,只有内心的回响。
    options:
      - {id: a, text: 投入毕生,任其寂寞, scores: {idealism: 2, conscientiousness: 2, risk_taking: 1}, tag: courage}
      - {id: b, text: 记录保存,不亲自传承, scores: {idealism: 1, conscientiousness: 1}, tag: pragmatic}
      - {id: c, text: 让它安息,专注现实, scores: {idealism: -2, conscientiousness: 0}, tag: avoidance}
    historical_figure: 樊锦诗
    historical_choice: a
  - id: c_d8
    type: dilemma
    prompt: 你的挚友成了你最大对手,你能用私密旧事击溃 ta,但会毁了 ta 一生。
    dimensions: [agreeableness, risk_taking, idealism]
    time_limit_sec: 15
    scenario: 你们曾无话不谈。如今在巅峰对决,曝光 ta 的旧错就能赢,但 ta 将万劫不复。
    options:
      - {id: a, text: 公平较量,不用旧事, scores: {agreeableness: 2, idealism: 2, risk_taking: 1}, tag: courage}
      - {id: b, text: 暗示警告,逼 ta 退让, scores: {agreeableness: -1, risk_taking: 0}, tag: pragmatic}
      - {id: c, text: 曝光旧事,确保胜利, scores: {agreeableness: -2, idealism: -2, risk_taking: 2}, tag: avoidance}
    historical_figure: 苏轼
    historical_choice: a

  # ===== 扩展资源分配题 =====
  - id: c_a3
    type: allocation
    prompt: 你有一年寿命可换任何成就,如何分配?
    dimensions: [idealism, conscientiousness, openness, agreeableness]
    targets:
      - {id: art, text: 创作传世作品, scores: {openness: 1, idealism: 1}}
      - {id: family_time, text: 陪伴家人, scores: {agreeableness: 1}}
      - {id: cause, text: 推动一项事业, scores: {idealism: 1, conscientiousness: 1}}
      - {id: knowledge, text: 探索未知, scores: {openness: 1}}
    total: 100

  # ===== 扩展排序题(价值优先级) =====
  - id: c_so1
    type: sort
    prompt: 排序你最看重的品质(1=最重要)
    dimensions: [openness, conscientiousness, agreeableness, idealism, risk_taking]
    items:
      - {id: curious, text: 好奇开放, scores: {openness: 1}}
      - {id: steady, text: 踏实可靠, scores: {conscientiousness: 1}}
      - {id: kind, text: 善良温和, scores: {agreeableness: 1}}
      - {id: principled, text: 坚守原则, scores: {idealism: 1}}
      - {id: bold, text: 敢冒风险, scores: {risk_taking: 1}}

  # ===== 扩展量表题 II(细化情境) =====
  - id: c_s13
    type: scale
    prompt: 看到陌生人遭遇明显不公,你的本能反应?
    dimensions: [idealism, agreeableness]
    points:
      - {id: "1", text: 与我无关, scores: {idealism: -2, agreeableness: -1}}
      - {id: "2", text: 同情不介入, scores: {idealism: -1}}
      - {id: "3", text: 视情况, scores: {idealism: 0}}
      - {id: "4", text: 想帮一把, scores: {idealism: 1, agreeableness: 1}}
      - {id: "5", text: 立即挺身, scores: {idealism: 2, agreeableness: 2}}
  - id: c_s14
    type: scale
    prompt: 你更欣赏哪一类作品?
    dimensions: [openness]
    points:
      - {id: "1", text: 经典熟悉, scores: {openness: -2}}
      - {id: "2", text: 大众流行, scores: {openness: -1}}
      - {id: "3", text: 都可以, scores: {openness: 0}}
      - {id: "4", text: 小众独特, scores: {openness: 1}}
      - {id: "5", text: 前卫实验, scores: {openness: 2}}
  - id: c_s15
    type: scale
    prompt: 重大失败后,你的第一反应?
    dimensions: [neuroticism, conscientiousness]
    points:
      - {id: "1", text: 长期消沉, scores: {neuroticism: 2, conscientiousness: -1}}
      - {id: "2", text: 短暂低落, scores: {neuroticism: 1}}
      - {id: "3", text: 平复重启, scores: {neuroticism: 0}}
      - {id: "4", text: 复盘原因, scores: {conscientiousness: 1, neuroticism: -1}}
      - {id: "5", text: 立即再战, scores: {conscientiousness: 2, neuroticism: -2}}
  - id: c_s16
    type: scale
    prompt: 上级给出你确信有误的指令,你?
    dimensions: [openness, idealism]
    points:
      - {id: "1", text: 照做不疑, scores: {openness: -2, idealism: -1}}
      - {id: "2", text: 勉强执行, scores: {openness: -1}}
      - {id: "3", text: 私下嘀咕, scores: {openness: 0}}
      - {id: "4", text: 委婉提出, scores: {openness: 1}}
      - {id: "5", text: 当面反驳, scores: {openness: 2, idealism: 1}}
  - id: c_s17
    type: scale
    prompt: 连续独处一周、几无联络,你会?
    dimensions: [extraversion, neuroticism]
    points:
      - {id: "1", text: 焦虑难耐, scores: {extraversion: 2, neuroticism: 2}}
      - {id: "2", text: 勉强适应, scores: {extraversion: 1}}
      - {id: "3", text: 无所谓, scores: {extraversion: 0}}
      - {id: "4", text: 享受清净, scores: {extraversion: -1}}
      - {id: "5", text: 如鱼得水, scores: {extraversion: -2, neuroticism: -1}}
  - id: c_s18
    type: scale
    prompt: 面对势均力敌的对手,你?
    dimensions: [extraversion, risk_taking]
    points:
      - {id: "1", text: 主动退让, scores: {risk_taking: -2}}
      - {id: "2", text: 避免冲突, scores: {risk_taking: -1}}
      - {id: "3", text: 看利益, scores: {risk_taking: 0}}
      - {id: "4", text: 迎接挑战, scores: {risk_taking: 1, extraversion: 1}}
      - {id: "5", text: 志在必得, scores: {risk_taking: 2, extraversion: 2}}
  - id: c_s19
    type: scale
    prompt: 你对他人的承诺,兑现程度?
    dimensions: [conscientiousness, agreeableness]
    points:
      - {id: "1", text: 经常食言, scores: {conscientiousness: -2, agreeableness: -1}}
      - {id: "2", text: 看心情, scores: {conscientiousness: -1}}
      - {id: "3", text: 多数兑现, scores: {conscientiousness: 0}}
      - {id: "4", text: 努力兑现, scores: {conscientiousness: 1}}
      - {id: "5", text: 一诺千金, scores: {conscientiousness: 2, agreeableness: 2}}
  - id: c_s20
    type: scale
    prompt: 是什么驱动你学习新东西?
    dimensions: [openness]
    points:
      - {id: "1", text: 被迫需要, scores: {openness: -2}}
      - {id: "2", text: 实用目的, scores: {openness: -1}}
      - {id: "3", text: 半用半趣, scores: {openness: 0}}
      - {id: "4", text: 纯粹好奇, scores: {openness: 1}}
      - {id: "5", text: 无法抑制, scores: {openness: 2}}
  - id: c_s21
    type: scale
    prompt: 做重要决定时,你主要依据?
    dimensions: [conscientiousness, idealism]
    points:
      - {id: "1", text: 凭直觉, scores: {conscientiousness: -2}}
      - {id: "2", text: 听熟人, scores: {conscientiousness: -1}}
