# 意识镜 —— 你的意识形态定位
# 量表28 + 困境8 + 排序8 + IAT 7 = 51题
# 维度:经济轴(左←→右) + 社会轴(权威↑↓自由) + 传统vs进步 + 民族vs全球
# 匹配意识形态标签:见 data/ideologies/ideology.yaml
assessment_type: ideology
title: 意识镜
description: 测出你在政治光谱上的定位,与哪种意识形态最接近。
estimated_minutes: 15
dimensions:
  - econ_left
  - econ_right
  - authority
  - liberty
  - tradition
  - progress
  - nationalist
  - globalist
questions:
  # ===== 量表题(经济轴+社会轴+传统进步轴+民族全球轴) =====
  - id: i_s1
    type: scale
    prompt: 政府是否应该对富人征高税以缩小贫富差距?
    dimensions: [econ_left, econ_right]
    points:
      - {id: "1", text: 完全应该, scores: {econ_left: 2}}
      - {id: "2", text: 倾向应该, scores: {econ_left: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向不应, scores: {econ_right: 1}}
      - {id: "5", text: 完全不应, scores: {econ_right: 2}}
  - id: i_s2
    type: scale
    prompt: 关键行业(医疗/能源/铁路)是否应国有化?
    dimensions: [econ_left, econ_right]
    points:
      - {id: "1", text: 应全部国有, scores: {econ_left: 2}}
      - {id: "2", text: 部分国有, scores: {econ_left: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向私有, scores: {econ_right: 1}}
      - {id: "5", text: 完全私有, scores: {econ_right: 2}}
  - id: i_s3
    type: scale
    prompt: 国家是否可以为了安全限制个人隐私?
    dimensions: [authority, liberty]
    points:
      - {id: "1", text: 完全可以, scores: {authority: 2}}
      - {id: "2", text: 倾向可以, scores: {authority: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向不可, scores: {liberty: 1}}
      - {id: "5", text: 完全不可, scores: {liberty: 2}}
  - id: i_s4
    type: scale
    prompt: 同性婚姻与跨性别权利是否应受法律保障?
    dimensions: [progress, tradition]
    points:
      - {id: "1", text: 充分保障, scores: {progress: 2}}
      - {id: "2", text: 倾向保障, scores: {progress: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向限制, scores: {tradition: 1}}
      - {id: "5", text: 严格限制, scores: {tradition: 2}}
  - id: i_s5
    type: scale
    prompt: 国家利益是否应高于国际合作?
    dimensions: [nationalist, globalist]
    points:
      - {id: "1", text: 国家优先, scores: {nationalist: 2}}
      - {id: "2", text: 倾向国家, scores: {nationalist: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向合作, scores: {globalist: 1}}
      - {id: "5", text: 全球优先, scores: {globalist: 2}}
  - id: i_s6
    type: scale
    prompt: 最低工资与劳动法是否应强化?
    dimensions: [econ_left, econ_right]
    points:
      - {id: "1", text: 大幅强化, scores: {econ_left: 2}}
      - {id: "2", text: 适度强化, scores: {econ_left: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 适度放松, scores: {econ_right: 1}}
      - {id: "5", text: 大幅放松, scores: {econ_right: 2}}
  - id: i_s7
    type: scale
    prompt: 言论自由是否应限制仇恨言论?
    dimensions: [authority, liberty]
    points:
      - {id: "1", text: 应严格限制, scores: {authority: 2}}
      - {id: "2", text: 倾向限制, scores: {authority: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向不限, scores: {liberty: 1}}
      - {id: "5", text: 绝对自由, scores: {liberty: 2}}
  - id: i_s8
    type: scale
    prompt: 移民政策应该更开放还是更严格?
    dimensions: [globalist, nationalist, progress, tradition]
    points:
      - {id: "1", text: 大幅开放, scores: {globalist: 2, progress: 1}}
      - {id: "2", text: 适度开放, scores: {globalist: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 适度收紧, scores: {nationalist: 1}}
      - {id: "5", text: 严格收紧, scores: {nationalist: 2, tradition: 1}}
  - id: i_s9
    type: scale
    prompt: 传统家庭结构(异性婚姻+生育)是否应被倡导?
    dimensions: [tradition, progress]
    points:
      - {id: "1", text: 强力倡导, scores: {tradition: 2}}
      - {id: "2", text: 倾向倡导, scores: {tradition: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向多元, scores: {progress: 1}}
      - {id: "5", text: 完全多元, scores: {progress: 2}}
  - id: i_s10
    type: scale
    prompt: 面对气候问题,本国是否应承担与他国同等减排义务?
    dimensions: [globalist, nationalist]
    points:
      - {id: "1", text: 承担更多, scores: {globalist: 2}}
      - {id: "2", text: 同等承担, scores: {globalist: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 发展优先, scores: {nationalist: 1}}
      - {id: "5", text: 拒绝约束, scores: {nationalist: 2}}

  # ===== 排序题(议题优先级) =====
  - id: i_so1
    type: sort
    prompt: 按你认为国家应优先处理的议题排序(1=最优先)
    dimensions: [econ_left, econ_right, authority, liberty, tradition, progress]
    items:
      - {id: inequality, text: 缩小贫富差距, scores: {econ_left: 1}}
      - {id: growth, text: 经济增长, scores: {econ_right: 1}}
      - {id: security, text: 国家安全, scores: {authority: 1}}
      - {id: rights, text: 个人自由, scores: {liberty: 1}}
      - {id: family, text: 传统家庭价值, scores: {tradition: 1}}
      - {id: environment, text: 环境与未来, scores: {progress: 1}}
  - id: i_so2
    type: sort
    prompt: 排序你最看重的政府职能(1=最重要)
    dimensions: [econ_left, econ_right, authority, liberty, tradition, progress, nationalist, globalist]
    items:
      - {id: redistribute, text: 再分配财富, scores: {econ_left: 1}}
      - {id: market, text: 维护市场秩序, scores: {econ_right: 1}}
      - {id: order, text: 维护社会秩序, scores: {authority: 1}}
      - {id: protect_rights, text: 保障个人权利, scores: {liberty: 1}}
      - {id: morality, text: 倡导道德风尚, scores: {tradition: 1}}
      - {id: innovate, text: 推动社会进步, scores: {progress: 1}}
  - id: i_so3
    type: sort
    prompt: 排序你认为国家对外应优先的姿态(1=最优先)
    dimensions: [nationalist, globalist, authority, liberty]
    items:
      - {id: sovereignty, text: 捍卫主权利益, scores: {nationalist: 1, authority: 1}}
      - {id: cooperation, text: 推动全球合作, scores: {globalist: 1}}
      - {id: strength, text: 展现实力威慑, scores: {nationalist: 1, authority: 1}}
      - {id: noninterference, text: 互不干涉, scores: {liberty: 1, nationalist: 1}}

  # ===== IAT(内隐联想,简化版) =====
  - id: i_iat1
    type: iat
    prompt: 快速分类:看到词语按直觉点左或右
    dimensions: [tradition, progress]
    time_limit_sec: 60
    left_label: 传统/权威
    right_label: 进步/自由
    words:
      - {word: 家庭, category: left}
      - {word: 革命, category: right}
      - {word: 秩序, category: left}
      - {word: 创新, category: right}
      - {word: 服从, category: left}
      - {word: 反叛, category: right}
      - {word: 敬老, category: left}
      - {word: 平等, category: right}
  - id: i_iat2
    type: iat
    prompt: 快速分类:经济相关词语的直觉
    dimensions: [econ_left, econ_right]
    time_limit_sec: 60
    left_label: 国家/集体
    right_label: 市场/个人
    words:
      - {word: 国有, category: left}
      - {word: 私有, category: right}
      - {word: 福利, category: left}
      - {word: 竞争, category: right}
      - {word: 均贫富, category: left}
      - {word: 自由市场, category: right}
      - {word: 工会, category: left}
      - {word: 企业家, category: right}
  - id: i_iat3
    type: iat
    prompt: 快速分类:国家与世界的直觉联想
    dimensions: [nationalist, globalist]
    time_limit_sec: 60
    left_label: 民族/本国
    right_label: 世界/人类
    words:
      - {word: 国货, category: left}
      - {word: 普世, category: right}
      - {word: 边境, category: left}
      - {word: 无国界, category: right}
      - {word: 本族, category: left}
      - {word: 移民, category: right}
      - {word: 主权, category: left}
      - {word: 联合国, category: right}

  # ===== 扩展量表题(深化各轴) =====
  - id: i_s11
    type: scale
    prompt: 工会与劳动者集体谈判权是否应被强化?
    dimensions: [econ_left, econ_right]
    points:
      - {id: "1", text: 大幅强化, scores: {econ_left: 2}}
      - {id: "2", text: 适度强化, scores: {econ_left: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 适度限制, scores: {econ_right: 1}}
      - {id: "5", text: 严格限制, scores: {econ_right: 2}}
  - id: i_s12
    type: scale
    prompt: 政府是否应审查媒体与网络内容以维护稳定?
    dimensions: [authority, liberty]
    points:
      - {id: "1", text: 应当审查, scores: {authority: 2}}
      - {id: "2", text: 倾向审查, scores: {authority: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向自由, scores: {liberty: 1}}
      - {id: "5", text: 绝对自由, scores: {liberty: 2}}
  - id: i_s13
    type: scale
    prompt: 性别角色是否应回归传统分工?
    dimensions: [tradition, progress]
    points:
      - {id: "1", text: 完全回归, scores: {tradition: 2}}
      - {id: "2", text: 倾向传统, scores: {tradition: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向平等, scores: {progress: 1}}
      - {id: "5", text: 彻底平等, scores: {progress: 2}}
  - id: i_s14
    type: scale
    prompt: 国际组织(联合国/世卫)的决议对本国是否有约束力?
    dimensions: [globalist, nationalist]
    points:
      - {id: "1", text: 高于本国, scores: {globalist: 2}}
      - {id: "2", text: 应当尊重, scores: {globalist: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向自主, scores: {nationalist: 1}}
      - {id: "5", text: 完全自主, scores: {nationalist: 2}}
  - id: i_s15
    type: scale
    prompt: 教育与医疗应作为基本权利免费提供,还是由市场决定?
    dimensions: [econ_left, econ_right]
    points:
      - {id: "1", text: 全部免费, scores: {econ_left: 2}}
      - {id: "2", text: 基本免费, scores: {econ_left: 1}}
      - {id: "3", text: 混合制, scores: {}}
      - {id: "4", text: 倾向市场, scores: {econ_right: 1}}
      - {id: "5", text: 完全市场, scores: {econ_right: 2}}

  # ===== 困境题(意识形态真实冲突) =====
  - id: i_d1
    type: dilemma
    prompt: 经济危机中,政府应救大企业还是直接发钱给民众?
    dimensions: [econ_left, econ_right]
    time_limit_sec: 15
    scenario: 危机来临。救企业能保就业但肥了资本;发钱给民众即时有效但可能通胀。
    options:
      - {id: a, text: 直接发钱给民众, scores: {econ_left: 2}}
      - {id: b, text: 救企业保就业, scores: {econ_right: 2}}
      - {id: c, text: 两者各半, scores: {econ_left: 0, econ_right: 0}}
  - id: i_d2
    type: dilemma
    prompt: 为反恐,政府要求全面监控通信,你?
    dimensions: [authority, liberty]
    time_limit_sec: 15
    scenario: 恐袭威胁升高。全面监控能预防袭击,但所有公民隐私将不复存在。
    options:
      - {id: a, text: 支持监控,安全优先, scores: {authority: 2}}
      - {id: b, text: 反对监控,自由优先, scores: {liberty: 2}}
      - {id: c, text: 有监督的有限监控, scores: {authority: 1, liberty: 1}}

  # ===== 扩展排序题 =====
  - id: i_so4
    type: sort
    prompt: 排序你认为最重要的公民自由(1=最重要)
    dimensions: [liberty, authority, tradition, progress]
    items:
      - {id: speech, text: 言论自由, scores: {liberty: 1}}
      - {id: privacy, text: 隐私权, scores: {liberty: 1}}
      - {id: assembly, text: 集会结社, scores: {liberty: 1, progress: 1}}
      - {id: religion, text: 信仰自由, scores: {liberty: 1, tradition: 1}}
      - {id: arms, text: 持有权, scores: {liberty: 1, authority: -1}}

  # ===== 扩展 IAT(内隐联想) =====
  - id: i_iat4
    type: iat
    prompt: 快速分类:权威与自由的直觉联想
    dimensions: [authority, liberty]
    time_limit_sec: 60
    left_label: 秩序/权威
    right_label: 自由/权利
    words:
      - {word: 法治, category: left}
      - {word: 抗争, category: right}
      - {word: 服从, category: left}
      - {word: 反抗, category: right}
      - {word: 稳定, category: left}
      - {word: 异见, category: right}
      - {word: 长官, category: left}
      - {word: 公民, category: right}

  # ===== 扩展量表题 II(现代政策议题) =====
  - id: i_s16
    type: scale
    prompt: 随着自动化与AI普及,是否应推行全民基本收入(UBI)?
    dimensions: [econ_left, econ_right]
    points:
      - {id: "1", text: 应推行UBI, scores: {econ_left: 2}}
      - {id: "2", text: 倾向推行, scores: {econ_left: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向不推, scores: {econ_right: 1}}
      - {id: "5", text: 不应推行, scores: {econ_right: 2}}
  - id: i_s17
    type: scale
    prompt: 是否应对高排放企业征收碳税以应对气候变化?
    dimensions: [econ_left, econ_right, globalist]
    points:
      - {id: "1", text: 高额碳税, scores: {econ_left: 2, globalist: 1}}
      - {id: "2", text: 适度碳税, scores: {econ_left: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向自愿减排, scores: {econ_right: 1}}
      - {id: "5", text: 反对碳税, scores: {econ_right: 2}}
  - id: i_s18
    type: scale
    prompt: 是否应严格管控民间枪支持有?
    dimensions: [authority, liberty]
    points:
      - {id: "1", text: 全面禁枪, scores: {authority: 2}}
      - {id: "2", text: 严格管控, scores: {authority: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 适度放宽, scores: {liberty: 1}}
      - {id: "5", text: 自由持有, scores: {liberty: 2}}
  - id: i_s19
    type: scale
    prompt: 女性堕胎权是否应由法律保障?
    dimensions: [progress, tradition]
    points:
      - {id: "1", text: 完全保障, scores: {progress: 2}}
      - {id: "2", text: 倾向保障, scores: {progress: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向限制, scores: {tradition: 1}}
      - {id: "5", text: 严格禁止, scores: {tradition: 2}}
  - id: i_s20
    type: scale
    prompt: 平台经济(外卖/网约车)的零工劳动者是否应享有正式工会权?
    dimensions: [econ_left, econ_right]
    points:
      - {id: "1", text: 强制保障, scores: {econ_left: 2}}
      - {id: "2", text: 倾向保障, scores: {econ_left: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向自愿, scores: {econ_right: 1}}
      - {id: "5", text: 不应干预, scores: {econ_right: 2}}
  - id: i_s21
    type: scale
    prompt: 是否应对巨额遗产征收高税率遗产税?
    dimensions: [econ_left, econ_right]
    points:
      - {id: "1", text: 高额征收, scores: {econ_left: 2}}
      - {id: "2", text: 适度征收, scores: {econ_left: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向低税, scores: {econ_right: 1}}
      - {id: "5", text: 废除遗产税, scores: {econ_right: 2}}
  - id: i_s22
    type: scale
    prompt: 高校招生是否应给弱势群体适当倾斜(教育平权)?
    dimensions: [progress, tradition]
    points:
      - {id: "1", text: 强力倾斜, scores: {progress: 2}}
      - {id: "2", text: 适度倾斜, scores: {progress: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向唯才, scores: {tradition: 1}}
      - {id: "5", text: 严格唯才, scores: {tradition: 2}}
  - id: i_s23
    type: scale
    prompt: 是否应立法打击网络谣言与AI深度伪造内容?
    dimensions: [authority, liberty]
    points:
      - {id: "1", text: 严格立法, scores: {authority: 2}}
      - {id: "2", text: 倾向管控, scores: {authority: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向自律, scores: {liberty: 1}}
      - {id: "5", text: 不应限制, scores: {liberty: 2}}
  - id: i_s24
    type: scale
    prompt: 企业收集个人数据用于算法推荐是否应严格限制?
    dimensions: [liberty, authority]
    points:
      - {id: "1", text: 严格限制, scores: {liberty: 2}}
      - {id: "2", text: 倾向限制, scores: {liberty: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向允许, scores: {authority: 1}}
      - {id: "5", text: 允许自由使用, scores: {authority: 2}}
  - id: i_s25
    type: scale
    prompt: 本国是否应提高移民配额以应对人口老龄化?
    dimensions: [globalist, nationalist]
    points:
      - {id: "1", text: 大幅提高, scores: {globalist: 2}}
      - {id: "2", text: 适度提高, scores: {globalist: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向收紧, scores: {nationalist: 1}}
      - {id: "5", text: 严格收紧, scores: {nationalist: 2}}
  - id: i_s26
    type: scale
    prompt: 是否应对进口商品加征关税以保护本国制造业?
    dimensions: [nationalist, globalist]
    points:
      - {id: "1", text: 高关税保护, scores: {nationalist: 2}}
      - {id: "2", text: 适度保护, scores: {nationalist: 1}}
      - {id: "3", text: 中立, scores: {}}
      - {id: "4", text: 倾向自由贸易, scores: {globalist: 1}}
      - {id: "5", text: 完全自由贸易, scores: {globalist: 2}}
  - id: i_s27
    type: scale
    prompt: 政府是否应强力监管人工智能的研发与应用?
    dimensions: [authority, liberty, progress]
    points:
      - {id: "1", text: 强力监管, scores: {authority: 2}}
      - {id: "2", text: 适度监管, scores: {authority: 1}}
