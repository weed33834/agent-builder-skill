  # ===== 扩展困境题(真实政治冲突) =====
  - id: i_d3
    type: dilemma
    prompt: 贫困县发现稀土矿,开发能脱贫但会破坏生态,你?
    dimensions: [econ_right, progress, globalist]
    time_limit_sec: 15
    scenario: 开采稀土能带来就业与税收、摆脱贫困,但会污染水源、破坏生态,影响世代生计。
    options:
      - {id: a, text: 优先开发,发展脱贫, scores: {econ_right: 2}}
      - {id: b, text: 优先保护生态, scores: {progress: 2, globalist: 1}}
      - {id: c, text: 有限开发加环保补偿, scores: {econ_right: 1, progress: 1}}
  - id: i_d4
    type: dilemma
    prompt: 少数族群传统习俗与现代法律冲突,你?
    dimensions: [progress, tradition, globalist, nationalist]
    time_limit_sec: 15
    scenario: 某少数族群的传统习俗(如面纱/早婚/族内裁决)与本国现代法律冲突。尊重多元还是统一规制?
    options:
      - {id: a, text: 尊重文化多元,例外包容, scores: {progress: 2, globalist: 1}}
      - {id: b, text: 法律统一,维护主流文化, scores: {tradition: 2, nationalist: 1}}
      - {id: c, text: 个案协商, scores: {progress: 1, tradition: 1}}
  - id: i_d5
    type: dilemma
    prompt: 贫富悬殊严重,是否可征富人重税救济穷人,即便侵犯财产权?
    dimensions: [econ_left, econ_right, liberty]
    time_limit_sec: 15
    scenario: 贫富差距极端。征重税能救济穷人,但批评者认为这侵犯财产权与个人自由。
    options:
      - {id: a, text: 征重税再分配, scores: {econ_left: 2}}
      - {id: b, text: 保护财产权,减税, scores: {econ_right: 2, liberty: 1}}
      - {id: c, text: 适度累进税, scores: {econ_left: 1, econ_right: 1}}
  - id: i_d6
    type: dilemma
    prompt: 面对严重社会不公,应革命推翻还是渐进改良?
    dimensions: [progress, tradition, authority, liberty]
    time_limit_sec: 15
    scenario: 制度严重不公,民怨沸腾。革命能彻底变革但伴随动荡流血;改良温和但可能被既得利益阻挠。
    options:
      - {id: a, text: 支持革命,彻底变革, scores: {progress: 2, liberty: 1}}
      - {id: b, text: 支持改良,维护稳定, scores: {tradition: 2, authority: 1}}
      - {id: c, text: 视情况而定, scores: {progress: 1, tradition: 1}}
  - id: i_d7
    type: dilemma
    prompt: 组织公开煽动种族仇恨,是否应封禁?
    dimensions: [authority, liberty]
    time_limit_sec: 15
    scenario: 一个组织公开宣扬种族仇恨、煽动排斥移民。封禁侵犯言论自由,但不封禁可能引发暴力。
    options:
      - {id: a, text: 立即封禁, scores: {authority: 2}}
      - {id: b, text: 保护言论,不封禁, scores: {liberty: 2}}
      - {id: c, text: 限制线下行动,线上警告, scores: {authority: 1, liberty: 1}}
  - id: i_d8
    type: dilemma
    prompt: 全城部署AI人脸识别以预防犯罪,你?
    dimensions: [authority, liberty]
    time_limit_sec: 15
    scenario: 全城部署AI人脸识别能大幅降低犯罪率,但意味着每个人的一举一动都被记录追踪。
    options:
      - {id: a, text: 支持部署,安全优先, scores: {authority: 2}}
      - {id: b, text: 反对部署,自由优先, scores: {liberty: 2}}
      - {id: c, text: 限定公共场所加定期删除, scores: {authority: 1, liberty: 1}}

