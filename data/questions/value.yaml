# 价值镜 —— 你的价值观与道德水平
# 困境9 + 资源分配3 + 排序3 = 15题(科尔伯格式分级)
# 维度:诚实/利他/公正/责任/共情/自律
assessment_type: value
title: 价值镜
description: 通过两难困境与资源分配,测出你的真实价值观与道德水平。
estimated_minutes: 12
dimensions:
  - honesty
  - altruism
  - justice
  - duty
  - empathy
  - discipline
questions:
  # ===== 困境题(科尔伯格式) =====
  - id: v_d1
    type: dilemma
    prompt: 配偶患重病,药价十倍于成本,你偷不偷?
    dimensions: [honesty, altruism, justice]
    time_limit_sec: 15
    scenario: 药商垄断抬价,你配偶将死。偷药能救 ta,但违法。
    options:
      - {id: a, text: 偷药救人, scores: {altruism: 2, honesty: -2, justice: 1}}
      - {id: b, text: 不偷,寻求合法途径, scores: {honesty: 2, duty: 2, altruism: -1}}
      - {id: c, text: 偷药后自首, scores: {altruism: 2, honesty: 1, duty: 1, justice: 1}}
  - id: v_d2
    type: dilemma
    prompt: 你无意导致同事被开除,真相不说没人知道。
    dimensions: [honesty, justice, duty]
    time_limit_sec: 15
    scenario: 你的失误被算到同事头上,ta 因此失业。澄清会让你被开除。
    options:
      - {id: a, text: 主动澄清,承担后果, scores: {honesty: 2, justice: 2, duty: 2}}
      - {id: b, text: 私下补偿同事, scores: {empathy: 2, honesty: -1}}
      - {id: c, text: 保持沉默, scores: {honesty: -2, justice: -2, duty: -1}}
  - id: v_d3
    type: dilemma
    prompt: 你捡到钱包,内有失主救命钱。
    dimensions: [honesty, altruism, empathy]
    time_limit_sec: 15
    scenario: 钱包里有 5 万现金和一张医院缴费单。失主显然急需。
    options:
      - {id: a, text: 全额归还, scores: {honesty: 2, altruism: 1, justice: 1}}
      - {id: b, text: 留下部分,归还剩余, scores: {honesty: -1, altruism: -1}}
      - {id: c, text: 全部留下, scores: {honesty: -2, altruism: -2, empathy: -2}}
  - id: v_d4
    type: dilemma
    prompt: 你是主管,要裁掉一个人,A 有家庭 B 是新人。
    dimensions: [justice, empathy, duty]
    time_limit_sec: 15
    scenario: 必须裁一人。A 业务能力强但有家庭压力;B 是新人潜力大但经验少。
    options:
      - {id: a, text: 留 A(资历+家庭), scores: {empathy: 2, justice: -1}}
      - {id: b, text: 留 B(潜力+绩效), scores: {justice: 2, empathy: -1}}
      - {id: c, text: 公开评估标准,按客观数据, scores: {justice: 2, duty: 2}}
  - id: v_d5
    type: dilemma
    prompt: 朋友酒驾撞人,求你顶包。
    dimensions: [honesty, altruism, justice, empathy]
    time_limit_sec: 15
    scenario: 朋友恳求你替 ta 承担,否则 ta 仕途尽毁。受害者重伤但脱离危险。
    options:
      - {id: a, text: 拒绝,劝其自首, scores: {honesty: 2, justice: 2, duty: 1}}
      - {id: b, text: 顶包,救朋友, scores: {altruism: 2, honesty: -2, justice: -2}}
      - {id: c, text: 拒绝但帮其赔偿, scores: {honesty: 1, empathy: 2, justice: 1}}
  - id: v_d6
    type: dilemma
    prompt: 你发现公益机构挪用善款,曝光会重创公众捐款信心。
    dimensions: [honesty, justice, altruism]
    time_limit_sec: 15
    scenario: 曝光能止损,但会让公众对所有公益失去信任,真正需要帮助的人受损。
    options:
      - {id: a, text: 公开曝光, scores: {honesty: 2, justice: 2, altruism: -1}}
      - {id: b, text: 内部举报促整改, scores: {honesty: 1, justice: 1, altruism: 1}}
      - {id: c, text: 沉默,避免伤害公益, scores: {honesty: -2, justice: -1, altruism: 1}}
  - id: v_d7
    type: dilemma
    prompt: 你承诺帮朋友搬家,当天有更好的机会(演唱会/面试)。
    dimensions: [duty, honesty, discipline]
    time_limit_sec: 15
    scenario: 朋友搬家只这一次,你早答应。突然来了难得的机会。
    options:
      - {id: a, text: 履约帮搬家, scores: {duty: 2, honesty: 1, discipline: 1}}
      - {id: b, text: 去机会,事后补偿, scores: {duty: -1, honesty: -1}}
      - {id: c, text: 看机会价值决定, scores: {duty: -2, discipline: -1}}
  - id: v_d8
    type: dilemma
    prompt: 考试监考松,你看到前排作弊,自己没作弊。
    dimensions: [honesty, justice, duty]
    time_limit_sec: 15
    scenario: 举报会影响考场秩序,不举报让作弊者得利,你老实复习却吃亏。
    options:
      - {id: a, text: 举手举报, scores: {honesty: 2, justice: 2, duty: 1}}
      - {id: b, text: 考后向老师反映, scores: {honesty: 1, justice: 1, duty: 1}}
      - {id: c, text: 不管闲事, scores: {honesty: -1, justice: -1, duty: -1}}
  - id: v_d9
    type: dilemma
    prompt: 你是医生,资源只够救一人:年轻罪犯还是老人科学家。
    dimensions: [justice, altruism, empathy]
    time_limit_sec: 15
    scenario: 年轻人曾犯罪但已悔过;老科学家尚有重要研究未完成。药只够一人用。
    options:
      - {id: a, text: 救年轻人(寿命长), scores: {altruism: 1, justice: 1}}
      - {id: b, text: 救科学家(贡献大), scores: {justice: -1, altruism: 0, empathy: -1}}
      - {id: c, text: 抽签,听天由命, scores: {justice: 2, empathy: 1}}

  # ===== 资源分配题 =====
  - id: v_a1
    type: allocation
    prompt: 你的时间(每周 100 单位)如何分配?
    dimensions: [duty, altruism, empathy, discipline]
    targets:
      - {id: work, text: 工作/事业, scores: {duty: 1, discipline: 1}}
      - {id: family, text: 陪伴家人, scores: {empathy: 1}}
      - {id: volunteer, text: 公益/助人, scores: {altruism: 1}}
      - {id: self, text: 自我成长, scores: {discipline: 1}}
    total: 100
  - id: v_a2
    type: allocation
    prompt: 一笔意外之财,如何分配?
    dimensions: [altruism, honesty, discipline, empathy]
    targets:
      - {id: repay, text: 还清欠款, scores: {honesty: 1, discipline: 1}}
      - {id: family, text: 给家人, scores: {empathy: 1}}
      - {id: donate, text: 捐出去, scores: {altruism: 1}}
      - {id: splurge, text: 自己享受, scores: {discipline: -1}}
    total: 100
  - id: v_a3
    type: allocation
    prompt: 你的精力(100)投入何处?
    dimensions: [duty, justice, altruism, discipline]
    targets:
      - {id: own, text: 个人目标, scores: {discipline: 1}}
      - {id: family, text: 家庭责任, scores: {duty: 1, empathy: 1}}
      - {id: weak, text: 帮弱势者, scores: {altruism: 1, justice: 1}}
      - {id: rule, text: 维护规则, scores: {justice: 1, duty: 1}}
    total: 100

  # ===== 排序题(价值优先级) =====
  - id: v_s1
    type: sort
    prompt: 按对你的重要程度排序(1=最重要)
    dimensions: [honesty, altruism, justice, duty, empathy, discipline]
    items:
      - {id: honesty, text: 诚实, scores: {honesty: 1}}
      - {id: altruism, text: 利他, scores: {altruism: 1}}
      - {id: justice, text: 公正, scores: {justice: 1}}
      - {id: duty, text: 责任, scores: {duty: 1}}
      - {id: empathy, text: 共情, scores: {empathy: 1}}
      - {id: discipline, text: 自律, scores: {discipline: 1}}
  - id: v_s2
    type: sort
    prompt: 当规则与情理冲突,排序你的考量优先级
    dimensions: [justice, empathy, duty, honesty]
    items:
      - {id: rule, text: 规则必须遵守, scores: {justice: 1, duty: 1}}
      - {id: mercy, text: 网开一面, scores: {empathy: 1}}
      - {id: truth, text: 还原真相, scores: {honesty: 1}}
      - {id: duty_first, text: 履职尽责, scores: {duty: 1}}
  - id: v_s3
    type: sort
    prompt: 排序你最无法容忍的行为(1=最不能忍)
    dimensions: [honesty, altruism, justice, duty, empathy, discipline]
    items:
      - {id: lie, text: 撒谎欺骗, scores: {honesty: 1}}
      - {id: selfish, text: 极端自私, scores: {altruism: 1}}
      - {id: unfair, text: 不公不义, scores: {justice: 1}}
      - {id: breach, text: 违背承诺, scores: {duty: 1}}
      - {id: cold, text: 冷漠无情, scores: {empathy: 1}}
      - {id: lazy, text: 怠惰放纵, scores: {discipline: 1}}
