# 意识形态库 —— 意识镜匹配用
# 经济轴:0=极左(全面国有) - 100=极右(完全自由市场)
# 社会轴:0=极自由 - 100=极权威
- id: soc_dem
  name: 社会民主主义
  blurb: 市场经济+福利国家,渐进改良
  coords: {econ: 30, social: 35}
- id: lib_dem
  name: 自由民主主义
  blurb: 市场经济+个人自由,有限政府
  coords: {econ: 65, social: 30}
- id: conservatism
  name: 保守主义
  blurb: 传统价值+社会秩序,谨慎变革
  coords: {econ: 60, social: 75}
- id: libertarian
  name: 自由意志主义
  blurb: 最小政府,最大自由,市场至上
  coords: {econ: 85, social: 15}
- id: dem_socialism
  name: 民主社会主义
  blurb: 生产资料社会化+民主政治
  coords: {econ: 15, social: 40}
- id: author_cap
  name: 国家主导型市场
  blurb: 自由市场+强国家管控
  coords: {econ: 70, social: 85}
- id: nat_conservatism
  name: 民族保守主义
  blurb: 民族优先+传统秩序+文化主权
  coords: {econ: 55, social: 80}
- id: progressivism
  name: 进步主义
  blurb: 平等+进步+全球合作,积极政府
  coords: {econ: 35, social: 20}
- id: classical_liberalism
  name: 古典自由主义
  blurb: 个人权利至上,自由贸易,宪政限权
  coords: {econ: 72, social: 25}
- id: eco_socialism
  name: 生态社会主义
  blurb: 反资本主义+环保+去中心化
  coords: {econ: 18, social: 25}
- id: social_liberal
  name: 社会自由主义
  blurb: 市场经济+积极自由+福利保障
  coords: {econ: 40, social: 22}
- id: technocracy
  name: 技术治理主义
  blurb: 专家治理+数据驱动+效率优先
  coords: {econ: 45, social: 60}
- id: libertarian_socialism
  name: 自由意志社会主义
  blurb: 反国家+反资本+工人自治
  coords: {econ: 20, social: 12}
- id: market_socialism
  name: 市场社会主义
  blurb: 公有制+市场机制+企业民主
  coords: {econ: 28, social: 38}
- id: corporatism
  name: 社团主义
  blurb: 阶级协作+国家调和+有机整体
  coords: {econ: 42, social: 85}
- id: distributism
  name: 分配主义
  blurb: 生产资料广分配+家庭本位+反垄断
  coords: {econ: 48, social: 65}
- id: third_way
  name: 第三条道路
  blurb: 超越左右+市场机制+社会投资
  coords: {econ: 55, social: 30}
- id: state_capitalism
  name: 国家资本主义
  blurb: 国家主导+市场工具+发展导向
  coords: {econ: 55, social: 88}
- id: neoconservatism
  name: 新保守主义
  blurb: 强硬外交+民主推广+传统价值
  coords: {econ: 70, social: 68}
- id: neoliberalism
  name: 新自由主义
  blurb: 自由市场+私有化+放松管制
  coords: {econ: 82, social: 42}
# ===== 学术型补充条目(填补删除后的方向缺口) =====
# 世俗主义:填补原"神权保守主义/基督教民主主义"等宗教政治方向删除后的理论空白
- id: secularism
  name: 世俗主义
  blurb: 政教分离+公共领域去宗教化+信仰私人化
  coords: {econ: 50, social: 25}
# 宗教自由主义:填补宗教政治方向的自由侧
- id: religious_liberalism
  name: 宗教自由主义
  blurb: 信仰宽容+多元共存+伦理导向公共生活
  coords: {econ: 45, social: 28}
# 互助主义:填补原"无政府资本主义/无政府工团主义"删除后的左翼无政府理论空白
# (Proudhon 学派,学术纯词,非暴力主张)
- id: mutualism
  name: 互助主义
  blurb: 自愿协作+小生产者联合+反集中化
  coords: {econ: 28, social: 10}
# 垄断资本主义:填补原"寡头资本主义"删除后的政治经济学方向空白
# (马克思主义政治经济学标准术语)
- id: monopoly_capitalism
  name: 垄断资本主义
  blurb: 资本集中+寡占市场+结构性壁垒
  coords: {econ: 88, social: 65}

