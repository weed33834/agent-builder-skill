<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="val-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f5ee"/>
      <stop offset="100%" stop-color="#d8d1c0"/>
    </linearGradient>
  </defs>

  <!-- 石镜底座 -->
  <rect x="20" y="62" width="40" height="6" rx="1" fill="#4a6b5c" opacity="0.5"/>

  <!-- 方形圆角石镜(青石色) -->
  <rect x="18" y="14" width="44" height="44" rx="6" fill="#4a6b5c"/>
  <rect x="22" y="18" width="36" height="36" rx="4" fill="url(#val-surface)"/>

  <!-- 沉稳高光 -->
  <path d="M 26 24 L 50 24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5" stroke-linecap="round"/>

  <!-- 描边 -->
  <rect x="18" y="14" width="44" height="44" rx="6" fill="none" stroke="#2f473b" stroke-width="1"/>
</svg>
