<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <filter id="gg-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <linearGradient id="gg-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="100%" stop-color="#0c0718"/>
    </linearGradient>
  </defs>
  <!-- 主机外壳:品红霓虹描边(发光层+清晰层) -->
  <rect x="7" y="5" width="34" height="38" rx="3" fill="#241038" stroke="#b8408b" stroke-width="2.2" filter="url(#gg-glow)" opacity="0.9"/>
  <rect x="7" y="5" width="34" height="38" rx="3" fill="none" stroke="#b8408b" stroke-width="1.6"/>
  <!-- 屏幕边框(紫) -->
  <rect x="10" y="8" width="28" height="20" rx="1.5" fill="url(#gg-screen)" stroke="#6b4a8b" stroke-width="1.2"/>
  <!-- 屏幕内像素心(品红,2px 像素格) -->
  <g fill="#b8408b" filter="url(#gg-glow)" opacity="0.9">
    <rect x="20" y="12" width="4" height="2"/><rect x="26" y="12" width="4" height="2"/>
    <rect x="18" y="14" width="12" height="2"/>
    <rect x="18" y="16" width="12" height="2"/>
    <rect x="20" y="18" width="8" height="2"/>
    <rect x="22" y="20" width="4" height="2"/>
  </g>
  <g fill="#b8408b">
    <rect x="20" y="12" width="4" height="2"/><rect x="26" y="12" width="4" height="2"/>
    <rect x="18" y="14" width="12" height="2"/>
    <rect x="18" y="16" width="12" height="2"/>
    <rect x="20" y="18" width="8" height="2"/>
    <rect x="22" y="20" width="4" height="2"/>
  </g>
  <!-- 十字键(紫) -->
  <rect x="13" y="33" width="6" height="2" fill="#6b4a8b"/>
  <rect x="15" y="31" width="2" height="6" fill="#6b4a8b"/>
  <!-- A/B 按键(青) -->
  <circle cx="31" cy="33" r="1.6" fill="#4a8b8b"/>
  <circle cx="35" cy="36" r="1.6" fill="#4a8b8b"/>
</svg>
