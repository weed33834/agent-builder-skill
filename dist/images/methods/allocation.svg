<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 分配:圆饼分三块 -->
  <g stroke="#1a1714" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <!-- 外圈 -->
    <circle cx="32" cy="32" r="18"/>
    <!-- 三等分线(从圆心放射) -->
    <line x1="32" y1="32" x2="32" y2="14"/>
    <line x1="32" y1="32" x2="47.59" y2="41"/>
    <line x1="32" y1="32" x2="16.41" y2="41"/>
    <!-- 圆心 -->
    <circle cx="32" cy="32" r="1.2" fill="#1a1714" stroke="none"/>
  </g>
</svg>
