<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- stitchTiles 使湍流无缝平铺;极低对比度纤维 -->
    <filter id="pf-fiber" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0125 0.18" numOctaves="2" seed="5" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.80  0 0 0 0 0.74  0 0 0 0 0.62  0 0 0 0.55 -0.30"/>
    </filter>
    <filter id="pf-streak" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.00625 0.09" numOctaves="3" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.72  0 0 0 0 0.66  0 0 0 0 0.54  0 0 0 0.4 -0.32"/>
    </filter>
  </defs>
  <!-- 宣纸米底 -->
  <rect width="400" height="400" fill="#f4efe3"/>
  <!-- 细密纤维纹 -->
  <rect width="400" height="400" filter="url(#pf-fiber)" opacity="0.5"/>
  <!-- 较长纤维丝 -->
  <rect width="400" height="400" filter="url(#pf-streak)" opacity="0.35"/>
  <!-- 极淡的手绘长纤维(低对比,平铺友好:贴边进出) -->
  <g stroke="#d8cfb8" stroke-width="0.5" opacity="0.35" fill="none">
    <path d="M0,64 Q120,58 240,70 T400,66"/>
    <path d="M0,168 Q140,174 280,160 T400,170"/>
    <path d="M0,272 Q120,266 260,278 T400,272"/>
    <path d="M0,360 Q150,366 300,354 T400,360"/>
  </g>
  <g stroke="#c9bfa3" stroke-width="0.4" opacity="0.25" fill="none">
    <path d="M40,0 Q48,120 36,240 T44,400"/>
    <path d="M200,0 Q206,140 196,280 T202,400"/>
    <path d="M340,0 Q346,130 336,260 T342,400"/>
  </g>
</svg>
