<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rel-mirror" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4efe3"/>
      <stop offset="55%" stop-color="#dfe7e4"/>
      <stop offset="100%" stop-color="#c5cfc9"/>
    </linearGradient>
  </defs>
  <!-- 左侧人形剪影(钢蓝,面朝右) -->
  <circle cx="15" cy="22" r="5" fill="#3a5670"/>
  <path d="M8,44 Q8,30 15,30 Q22,30 22,44 Z" fill="#3a5670"/>
  <!-- 右侧人形剪影(青石,面朝左) -->
  <circle cx="49" cy="22" r="5" fill="#4a6b5c"/>
  <path d="M42,44 Q42,30 49,30 Q56,30 56,44 Z" fill="#4a6b5c"/>
  <!-- 中央立镜:镜框(旧铜)+ 镜面 -->
  <rect x="27" y="13" width="10" height="34" rx="5" fill="#8b6a2e"/>
  <rect x="29" y="15" width="6" height="30" rx="3" fill="url(#rel-mirror)"/>
  <!-- 镜面高光 -->
  <path d="M30,20 Q31,17 33,17.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  <!-- 镜座 -->
  <rect x="25" y="47" width="14" height="3" rx="1" fill="#8b6a2e"/>
  <rect x="30" y="50" width="4" height="4" fill="#8b6a2e"/>
  <!-- 相互映照:两点朱墨连线意 -->
  <circle cx="20" cy="24" r="1" fill="#8b2e1f"/>
  <circle cx="44" cy="24" r="1" fill="#8b2e1f"/>
</svg>
