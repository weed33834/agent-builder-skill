<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- 霓虹发光:模糊副本置于清晰线之下 -->
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <!-- 手柄主体(品红主线)发光层 -->
  <g filter="url(#neon-glow)" opacity="0.85">
    <path d="M16,32 Q16,24 24,24 L40,24 Q48,24 48,32 L48,38 Q48,46 40,46 Q36,46 34,42 L30,42 Q28,46 24,46 Q16,46 16,38 Z"
          fill="none" stroke="#b8408b" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <!-- 手柄主体清晰层 -->
  <path d="M16,32 Q16,24 24,24 L40,24 Q48,24 48,32 L48,38 Q48,46 40,46 Q36,46 34,42 L30,42 Q28,46 24,46 Q16,46 16,38 Z"
        fill="none" stroke="#b8408b" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- 左侧十字键(青辅线) -->
  <path d="M22,33 H28 M25,30 V36" fill="none" stroke="#4a8b8b" stroke-width="1.8" stroke-linecap="round" filter="url(#neon-glow)" opacity="0.9"/>
  <path d="M22,33 H28 M25,30 V36" fill="none" stroke="#4a8b8b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 右侧双按键 -->
  <circle cx="40" cy="31" r="1.8" fill="none" stroke="#4a8b8b" stroke-width="1.4"/>
  <circle cx="43.5" cy="35" r="1.8" fill="none" stroke="#4a8b8b" stroke-width="1.4"/>
  <!-- 顶部心形(品红,带发光) -->
  <path d="M32,12 C29.5,8 24,9.5 24,14 C24,18 32,23 32,23 C32,23 40,18 40,14 C40,9.5 34.5,8 32,12 Z"
        fill="#b8408b" filter="url(#neon-glow)" opacity="0.9"/>
  <path d="M32,12 C29.5,8 24,9.5 24,14 C24,18 32,23 32,23 C32,23 40,18 40,14 C40,9.5 34.5,8 32,12 Z"
        fill="#b8408b"/>
</svg>
