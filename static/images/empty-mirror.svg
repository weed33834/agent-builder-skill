<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="em-surface" cx="40%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#f8f5ee"/>
      <stop offset="55%" stop-color="#ece6d9"/>
      <stop offset="100%" stop-color="#d0c9ba"/>
    </radialGradient>
    <radialGradient id="em-fog" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f8f5ee" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#f4efe3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f4efe3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 镜框外圈(旧铜,克制) -->
  <circle cx="80" cy="80" r="68" fill="#8b6a2e" opacity="0.7"/>
  <circle cx="80" cy="80" r="68" fill="none" stroke="#5a4520" stroke-width="1"/>

  <!-- 镜面 -->
  <circle cx="80" cy="80" r="64" fill="url(#em-surface)"/>

  <!-- 雾气覆盖(中央渐隐) -->
  <circle cx="80" cy="80" r="58" fill="url(#em-fog)"/>

  <!-- 中央极淡墨色"?" -->
  <text x="80" y="98" text-anchor="middle"
        font-family="'Fraunces', 'Noto Serif SC', Georgia, serif"
        font-size="44" font-weight="300" fill="#1a1714" opacity="0.2">?</text>

  <!-- 镜面边缘微高光 -->
  <path d="M 30 56 Q 56 36 92 38" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
</svg>
