<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg-li_bai" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#c06a3a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a1a1a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="face-li_bai" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c8a0"/>
      <stop offset="100%" stop-color="#a07858"/>
    </radialGradient>
    <filter id="paint-li_bai">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>
  <rect width="240" height="240" fill="url(#bg-li_bai)"/>
  <!-- 装饰圆环 -->
  <circle cx="120" cy="100" r="85" fill="none" stroke="#e0a070" stroke-width="1" opacity="0.25"/>
  <!-- 肩膀/服装 -->
  <path d="M 35 240 L 55 170 L 90 175 L 120 200 L 150 175 L 185 170 L 205 240 Z" fill="#8a3a1a"/><path d="M 105 175 L 120 205 L 135 175 L 130 240 L 110 240 Z" fill="#c06a3a"/>
  <!-- 脖子 -->
  <rect x="105" y="160" width="30" height="25" fill="#a07858"/>
  <!-- 头部 -->
  <ellipse cx="120" cy="110" rx="38" ry="45" fill="url(#face-li_bai)"/>
  <!-- 头发 -->
  <ellipse cx="120" cy="60" rx="32" ry="20" fill="#8a3a1a"/><circle cx="120" cy="32" r="20" fill="#8a3a1a"/>
  <!-- 眼睛 -->
  <ellipse cx="108" cy="108" rx="3" ry="2" fill="#1a1a1a"/>
  <ellipse cx="132" cy="108" rx="3" ry="2" fill="#1a1a1a"/>
  <!-- 鼻 -->
  <path d="M 120 115 L 117 128 L 123 128 Z" fill="#8a6040" opacity="0.4"/>
  <!-- 胡须 -->
  <path d="M 90 105 Q 120 170 150 105 Q 140 160 120 165 Q 100 160 90 105 Z" fill="#8a3a1a"/>
  <!-- 标志物 -->
  <path d="M 150 200 L 210 130 L 215 135 L 160 210 Z" fill="#e0a070" opacity="0.85"/><line x1="150" y1="200" x2="210" y2="130" stroke="#000" stroke-width="0.5" opacity="0.5"/>
  <!-- 油画质感 filter 应用整体 -->
  <rect width="240" height="240" fill="#8a3a1a" opacity="0.05" filter="url(#paint-li_bai)"/>
  <!-- 名字水印 -->
  <rect x="0" y="218" width="240" height="22" fill="#3a1a1a" opacity="0.85"/>
  <text x="120" y="234" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Source Han Sans SC', 'WenQuanYi Micro Hei', 'Heiti SC', Georgia, serif" font-size="13" fill="#e0a070" font-weight="600" letter-spacing="2">李白</text>
</svg>