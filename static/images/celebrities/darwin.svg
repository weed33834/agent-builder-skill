<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg-darwin" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#b0b0c0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a3a4a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="face-darwin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c8a0"/>
      <stop offset="100%" stop-color="#a07858"/>
    </radialGradient>
    <filter id="paint-darwin">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>
  <rect width="240" height="240" fill="url(#bg-darwin)"/>
  <!-- 装饰圆环 -->
  <circle cx="120" cy="100" r="85" fill="none" stroke="#d8d8e0" stroke-width="1" opacity="0.25"/>
  <!-- 肩膀/服装 -->
  <path d="M 30 240 L 50 170 L 80 175 L 120 200 L 160 175 L 190 170 L 210 240 Z" fill="#7a7a8a"/><path d="M 110 178 L 120 210 L 130 178 L 128 240 L 112 240 Z" fill="#b0b0c0"/>
  <!-- 脖子 -->
  <rect x="105" y="160" width="30" height="25" fill="#a07858"/>
  <!-- 头部 -->
  <ellipse cx="120" cy="110" rx="38" ry="45" fill="url(#face-darwin)"/>
  <!-- 头发 -->
  <circle cx="100" cy="50" r="22" fill="#7a7a8a"/><circle cx="140" cy="48" r="22" fill="#7a7a8a"/><circle cx="120" cy="38" r="25" fill="#7a7a8a"/><circle cx="90" cy="60" r="18" fill="#7a7a8a"/><circle cx="150" cy="60" r="18" fill="#7a7a8a"/>
  <!-- 眼睛 -->
  <ellipse cx="108" cy="108" rx="3" ry="2" fill="#1a1a1a"/>
  <ellipse cx="132" cy="108" rx="3" ry="2" fill="#1a1a1a"/>
  <!-- 鼻 -->
  <path d="M 120 115 L 117 128 L 123 128 Z" fill="#8a6040" opacity="0.4"/>
  <!-- 胡须 -->
  <path d="M 90 105 Q 120 170 150 105 Q 140 160 120 165 Q 100 160 90 105 Z" fill="#7a7a8a"/>
  <!-- 标志物 -->
  
  <!-- 油画质感 filter 应用整体 -->
  <rect width="240" height="240" fill="#7a7a8a" opacity="0.05" filter="url(#paint-darwin)"/>
  <!-- 名字水印 -->
  <rect x="0" y="218" width="240" height="22" fill="#3a3a4a" opacity="0.85"/>
  <text x="120" y="234" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Source Han Sans SC', 'WenQuanYi Micro Hei', 'Heiti SC', Georgia, serif" font-size="13" fill="#d8d8e0" font-weight="600" letter-spacing="2">达尔文</text>
</svg>