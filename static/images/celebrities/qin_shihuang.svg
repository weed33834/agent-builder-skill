<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg-qin_shihuang" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#c04a2a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a1a1a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="face-qin_shihuang" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c8a0"/>
      <stop offset="100%" stop-color="#a07858"/>
    </radialGradient>
    <filter id="paint-qin_shihuang">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>
  <rect width="240" height="240" fill="url(#bg-qin_shihuang)"/>
  <!-- 装饰圆环 -->
  <circle cx="120" cy="100" r="85" fill="none" stroke="#e0886a" stroke-width="1" opacity="0.25"/>
  <!-- 肩膀/服装 -->
  <path d="M 30 240 L 50 165 L 80 170 L 120 200 L 160 170 L 190 165 L 210 240 Z" fill="#8a2a1a"/>
  <!-- 脖子 -->
  <rect x="105" y="160" width="30" height="25" fill="#a07858"/>
  <!-- 头部 -->
  <ellipse cx="120" cy="110" rx="38" ry="45" fill="url(#face-qin_shihuang)"/>
  <!-- 头发 -->
  <rect x="85" y="35" width="70" height="20" fill="#8a2a1a"/><path d="M 90 35 L 95 20 L 100 35 Z" fill="#8a2a1a"/><path d="M 110 35 L 115 20 L 120 35 Z" fill="#8a2a1a"/><path d="M 130 35 L 135 20 L 140 35 Z" fill="#8a2a1a"/><path d="M 150 35 L 155 20 L 160 35 Z" fill="#8a2a1a"/>
  <!-- 眼睛 -->
  <ellipse cx="108" cy="108" rx="3" ry="2" fill="#1a1a1a"/>
  <ellipse cx="132" cy="108" rx="3" ry="2" fill="#1a1a1a"/>
  <!-- 鼻 -->
  <path d="M 120 115 L 117 128 L 123 128 Z" fill="#8a6040" opacity="0.4"/>
  <!-- 胡须 -->
  <path d="M 90 105 Q 120 170 150 105 Q 140 160 120 165 Q 100 160 90 105 Z" fill="#8a2a1a"/>
  <!-- 标志物 -->
  
  <!-- 油画质感 filter 应用整体 -->
  <rect width="240" height="240" fill="#8a2a1a" opacity="0.05" filter="url(#paint-qin_shihuang)"/>
  <!-- 名字水印 -->
  <rect x="0" y="218" width="240" height="22" fill="#3a1a1a" opacity="0.85"/>
  <text x="120" y="234" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Source Han Sans SC', 'WenQuanYi Micro Hei', 'Heiti SC', Georgia, serif" font-size="13" fill="#e0886a" font-weight="600" letter-spacing="2">秦始皇</text>
</svg>