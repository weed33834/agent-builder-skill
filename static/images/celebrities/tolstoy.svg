<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg-tolstoy" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#a0a08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2a2a2a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="face-tolstoy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c8a0"/>
      <stop offset="100%" stop-color="#a07858"/>
    </radialGradient>
    <filter id="paint-tolstoy">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
  </defs>
  <rect width="240" height="240" fill="url(#bg-tolstoy)"/>
  <!-- 装饰圆环 -->
  <circle cx="120" cy="100" r="85" fill="none" stroke="#d0d0b8" stroke-width="1" opacity="0.25"/>
  <!-- 肩膀/服装 -->
  <path d="M 30 220 Q 60 180 120 175 L 120 240 L 30 240 Z" fill="#6a6a5a"/><path d="M 210 220 Q 180 180 120 175 L 120 240 L 210 240 Z" fill="#6a6a5a"/><path d="M 100 175 L 120 200 L 140 175 L 135 240 L 105 240 Z" fill="#a0a08a"/>
  <!-- 脖子 -->
  <rect x="105" y="160" width="30" height="25" fill="#a07858"/>
  <!-- 头部 -->
  <ellipse cx="120" cy="110" rx="38" ry="45" fill="url(#face-tolstoy)"/>
  <!-- 头发 -->
  <circle cx="100" cy="50" r="22" fill="#6a6a5a"/><circle cx="140" cy="48" r="22" fill="#6a6a5a"/><circle cx="120" cy="38" r="25" fill="#6a6a5a"/><circle cx="90" cy="60" r="18" fill="#6a6a5a"/><circle cx="150" cy="60" r="18" fill="#6a6a5a"/>
  <!-- 眼睛 -->
  <ellipse cx="108" cy="108" rx="3" ry="2" fill="#1a1a1a"/>
  <ellipse cx="132" cy="108" rx="3" ry="2" fill="#1a1a1a"/>
  <!-- 鼻 -->
  <path d="M 120 115 L 117 128 L 123 128 Z" fill="#8a6040" opacity="0.4"/>
  <!-- 胡须 -->
  <path d="M 90 105 Q 120 170 150 105 Q 140 160 120 165 Q 100 160 90 105 Z" fill="#6a6a5a"/>
  <!-- 标志物 -->
  <line x1="160" y1="170" x2="205" y2="120" stroke="#d0d0b8" stroke-width="2"/><path d="M 205 120 Q 215 105 210 90" stroke="#d0d0b8" stroke-width="2" fill="none"/>
  <!-- 油画质感 filter 应用整体 -->
  <rect width="240" height="240" fill="#6a6a5a" opacity="0.05" filter="url(#paint-tolstoy)"/>
  <!-- 名字水印 -->
  <rect x="0" y="218" width="240" height="22" fill="#2a2a2a" opacity="0.85"/>
  <text x="120" y="234" text-anchor="middle" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Source Han Sans SC', 'WenQuanYi Micro Hei', 'Heiti SC', Georgia, serif" font-size="13" fill="#d0d0b8" font-weight="600" letter-spacing="2">托尔斯泰</text>
</svg>