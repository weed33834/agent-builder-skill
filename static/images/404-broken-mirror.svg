<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bm-surface" cx="40%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#f8f5ee"/>
      <stop offset="60%" stop-color="#ece6d9"/>
      <stop offset="100%" stop-color="#d0c9ba"/>
    </radialGradient>
    <radialGradient id="bm-wound" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#8b2e1f" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8b2e1f" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8b2e1f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bm-clip">
      <circle cx="100" cy="90" r="62"/>
    </clipPath>
  </defs>

  <!-- 镜框外圈(旧铜) -->
  <circle cx="100" cy="90" r="66" fill="#8b6a2e" opacity="0.85"/>
  <circle cx="100" cy="90" r="66" fill="none" stroke="#5a4520" stroke-width="1"/>

  <!-- 镜面 -->
  <circle cx="100" cy="90" r="62" fill="url(#bm-surface)"/>

  <!-- 裂口朱墨晕染(被裁剪在镜内) -->
  <g clip-path="url(#bm-clip)">
    <ellipse cx="100" cy="92" rx="48" ry="40" fill="url(#bm-wound)"/>
  </g>

  <!-- 主裂纹(墨色折线,从中心向边缘) -->
  <g stroke="#1a1714" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.78">
    <path d="M 100 90 L 78 56 L 62 32"/>
    <path d="M 100 90 L 132 70 L 158 48"/>
    <path d="M 100 90 L 88 130 L 70 152"/>
    <path d="M 100 90 L 138 116 L 162 132"/>
    <!-- 分叉 -->
    <path d="M 78 56 L 56 64" opacity="0.5"/>
    <path d="M 132 70 L 122 50" opacity="0.5"/>
    <path d="M 88 130 L 100 148" opacity="0.5"/>
  </g>

  <!-- 裂片间隙(留白细缝) -->
  <g stroke="#f4efe3" stroke-width="0.6" fill="none" opacity="0.7">
    <path d="M 100 90 L 78 56"/>
    <path d="M 100 90 L 132 70"/>
    <path d="M 100 90 L 88 130"/>
  </g>

  <!-- 镜面高光弧(克制) -->
  <path d="M 56 70 Q 78 50 110 50" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" stroke-linecap="round"/>

  <!-- 右下角飘落碎片 -->
  <g transform="translate(150 158) rotate(28)">
    <polygon points="0,0 22,-4 28,12 8,18" fill="url(#bm-surface)" stroke="#1a1714" stroke-width="0.8" opacity="0.85"/>
    <polygon points="0,0 22,-4 28,12 8,18" fill="none" stroke="#8b2e1f" stroke-width="0.4" opacity="0.4"/>
  </g>
  <!-- 小碎片 -->
  <polygon points="178,178 188,172 192,184 182,188" fill="#ece6d9" stroke="#1a1714" stroke-width="0.6" opacity="0.7"/>
</svg>
