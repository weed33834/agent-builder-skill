<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="paper" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f8f5ee"/>
      <stop offset="60%" stop-color="#f4efe3"/>
      <stop offset="100%" stop-color="#e0d9cb"/>
    </radialGradient>
    <radialGradient id="mirror-grad" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#d4d8e0"/>
      <stop offset="45%" stop-color="#8a8d96"/>
      <stop offset="85%" stop-color="#4a4d54"/>
      <stop offset="100%" stop-color="#2a2d34"/>
    </radialGradient>
    <radialGradient id="mirror-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d04940" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d04940" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 宣纸底 -->
  <rect width="1200" height="630" fill="url(#paper)"/>

  <!-- 装饰圆 -->
  <circle cx="980" cy="120" r="180" fill="url(#mirror-glow)" opacity="0.6"/>

  <!-- 镜子 -->
  <g transform="translate(880, 80)">
    <circle cx="120" cy="120" r="100" fill="url(#mirror-grad)"/>
    <circle cx="120" cy="120" r="100" fill="none" stroke="#d04940" stroke-width="1.5" opacity="0.5"/>
    <circle cx="120" cy="120" r="108" fill="none" stroke="#8b6a2e" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- 标题 -->
  <text x="80" y="260" font-family="'Fraunces', 'Noto Serif SC', serif" font-size="140" font-weight="500" fill="#1a1714">心镜</text>
  <text x="80" y="340" font-family="'Fraunces', serif" font-size="56" font-weight="300" fill="#4a453e" letter-spacing="2">MindMirror</text>

  <!-- 副标题 -->
  <text x="80" y="430" font-family="'Noto Serif SC', serif" font-size="32" font-weight="400" fill="#4a453e">三面镜子 · 看见真实的自己</text>

  <!-- 分隔线 -->
  <line x1="80" y1="470" x2="240" y2="470" stroke="#8b2e1f" stroke-width="2"/>

  <!-- 三镜标签 -->
  <text x="80" y="520" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="400" fill="#8a857c">名人镜 · 价值镜 · 意识镜</text>

  <!-- 底部 -->
  <text x="80" y="580" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="300" fill="#b5af9f">情境化测评 · 行为轨迹分析 · 自我探索</text>
</svg>
