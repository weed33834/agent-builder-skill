<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <linearGradient id="lm-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a98640"/>
      <stop offset="50%" stop-color="#8b6a2e"/>
      <stop offset="100%" stop-color="#5a4520"/>
    </linearGradient>
    <radialGradient id="lm-surface" cx="40%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#f8f5ee"/>
      <stop offset="70%" stop-color="#ece6d9"/>
      <stop offset="100%" stop-color="#d0c9ba"/>
    </radialGradient>
    <linearGradient id="lm-handle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b6a2e"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </linearGradient>
  </defs>

  <!-- 手柄 -->
  <rect x="72" y="148" width="16" height="36" rx="2" fill="url(#lm-handle)"/>
  <rect x="68" y="142" width="24" height="10" rx="1.5" fill="#a98640"/>
  <rect x="68" y="145" width="24" height="2" fill="#5a4520"/>
  <ellipse cx="80" cy="186" rx="14" ry="3" fill="#1a1714" opacity="0.18"/>

  <!-- 镜框外圈(铜色) -->
  <circle cx="80" cy="76" r="62" fill="url(#lm-frame)"/>
  <!-- 镜框内圈(深色) -->
  <circle cx="80" cy="76" r="56" fill="#3a2810"/>
  <!-- 镜面(宣纸色) -->
  <circle cx="80" cy="76" r="52" fill="url(#lm-surface)"/>

  <!-- 镜面映出简笔人形(墨色,opacity 0.5) -->
  <g stroke="#1a1714" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <!-- 头 -->
    <circle cx="80" cy="56" r="10"/>
    <!-- 肩与身躯 -->
    <path d="M 64 92 Q 64 76 80 76 Q 96 76 96 92 L 96 110 L 64 110 Z"/>
    <!-- 手臂 -->
    <path d="M 64 92 L 56 110"/>
    <path d="M 96 92 L 104 110"/>
  </g>

  <!-- 镜面高光弧 -->
  <path d="M 38 50 Q 60 28 96 30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>

  <!-- 镜框金边高光 -->
  <circle cx="80" cy="76" r="62" fill="none" stroke="#d4a84a" stroke-width="0.6" opacity="0.6"/>
  <circle cx="80" cy="76" r="56" fill="none" stroke="#3a2810" stroke-width="0.6"/>

  <!-- 底部"見"字 -->
  <text x="80" y="200" text-anchor="middle"
        font-family="'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', Georgia, serif"
        font-size="11" letter-spacing="2" fill="#4a453e">見</text>
</svg>
