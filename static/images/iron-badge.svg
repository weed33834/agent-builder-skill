<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <style type="text/css">
      #locked { display: none; }
      #locked:target { display: inline; }
      #earned:target { display: inline; }
    </style>
    <radialGradient id="ib-fill" cx="40%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#a23824"/>
      <stop offset="60%" stop-color="#8b2e1f"/>
      <stop offset="100%" stop-color="#5a1c12"/>
    </radialGradient>
  </defs>

  <!-- earned 状态:朱墨实心八边形 + 中央"铁"字 + 外圈细金边 -->
  <g id="earned">
    <!-- 外圈金边 -->
    <polygon points="40,4 64,16 72,40 64,64 40,76 16,64 8,40 16,16"
             fill="none" stroke="#8b6a2e" stroke-width="1.2"/>
    <!-- 朱墨实心八边形 -->
    <polygon points="40,8 60,18 66,40 60,62 40,72 20,62 14,40 20,18"
             fill="url(#ib-fill)" stroke="#5a1c12" stroke-width="0.6"/>
    <!-- 内描边 -->
    <polygon points="40,12 57,21 62,40 57,59 40,68 23,59 18,40 23,21"
             fill="none" stroke="#d4a84a" stroke-width="0.4" opacity="0.6"/>
    <!-- 中央"铁"字 -->
    <text x="40" y="49" text-anchor="middle"
          font-family="'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', Georgia, serif"
          font-size="26" font-weight="600" fill="#f8f5ee" letter-spacing="0">铁</text>
  </g>

  <!-- locked 状态:灰色描边八边形(无填充)+ 中央锁形图标 -->
  <g id="locked" opacity="0.5">
    <polygon points="40,4 64,16 72,40 64,64 40,76 16,64 8,40 16,16"
             fill="none" stroke="#b5af9f" stroke-width="1.2"/>
    <polygon points="40,8 60,18 66,40 60,62 40,72 20,62 14,40 20,18"
             fill="none" stroke="#b5af9f" stroke-width="0.8"/>
    <!-- 锁形图标 -->
    <g stroke="#8a857c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 锁环 -->
      <path d="M 33 36 V 30 A 7 7 0 0 1 47 30 V 36"/>
      <!-- 锁身 -->
      <rect x="30" y="36" width="20" height="16" rx="1.5" fill="#d0c9ba" stroke="#8a857c"/>
      <!-- 锁孔 -->
      <circle cx="40" cy="42" r="1.6" fill="#4a453e" stroke="none"/>
      <line x1="40" y1="43" x2="40" y2="48" stroke="#4a453e" stroke-width="1.2"/>
    </g>
  </g>
</svg>
