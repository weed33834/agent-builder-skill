<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测评中 — 心镜 MindMirror</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="ripple-bg"></div>
<div class="container">
  <div class="take-header">
    <a href="/" class="back-link">← 退 出</a>
    <span id="title" class="title-label"></span>
  </div>
  <div class="progress-track"><div id="progress" class="progress-fill" style="width:0"></div></div>
  <div class="progress-text"><span id="progress-text"><span class="num">0</span> / 0</span></div>

  <div id="timer" class="timer-ring" style="display:none">
    <svg width="64" height="64">
      <circle class="track" cx="32" cy="32" r="28" fill="none" stroke-width="2"/>
      <circle class="fill" cx="32" cy="32" r="28" fill="none" stroke-width="2"
              stroke-dasharray="175.93" stroke-dashoffset="0"/>
    </svg>
    <div class="num">15</div>
  </div>

  <div id="question-area"></div>
</div>

<script src="/app.js"></script>
<script src="/take.js"></script>
</body>
</html>
