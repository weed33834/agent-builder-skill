<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="common.your_mirror">测评中 — 心镜 MindMirror</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container">
  <div class="take-header">
    <a href="/" class="back-link" data-i18n="common.exit">← 退出</a>
    <span id="title" class="title-label"></span>
  </div>
  <div class="progress-track"><div id="progress" class="progress-fill" style="width:0"></div></div>
  <div class="progress-text"><span id="progress-text"><span class="num">0</span> / 0</span></div>

  <div id="timer" class="timer-ring" style="display:none">
    <svg width="64" height="64">
      <circle class="track" cx="32" cy="32" r="28" fill="none" stroke-width="2"/>
      <circle class="fill" cx="32" cy="32" r="28" fill="none" stroke-width="2"
              stroke-dasharray="175.93" stroke-dashoffset="0"/>
    </svg>
    <div class="num">15</div>
  </div>

  <div id="rhythm-bar" class="rhythm-bar" style="display:none">
    <span class="rhythm-label" data-i18n="take.rhythm">节奏</span>
    <span class="rhythm-time" id="rhythm-time">0s</span>
    <span class="rhythm-changes" id="rhythm-changes"></span>
  </div>

  <div id="i18n-notice" class="i18n-notice" style="display:none"></div>
  <div id="question-area"></div>
</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script src="/take.js"></script>
<script>
  // 在答题页就注入语言切换器,这样用户在答题中也能切换
  injectLangSwitch();
  // 监听语言变化 —— 局部刷新(题目内容保持不丢答案)
  document.addEventListener('mm:lang-changed', () => {
    // 标题
    const type = new URLSearchParams(location.search).get('type');
    const titleEl = document.getElementById('title');
    if (titleEl && type) titleEl.textContent = mmI18n.t(`take.title_${type}`);
    // 题型徽章 / 进度文字(只在题目区显示时刷新)
    if (typeof refreshI18n === 'function') refreshI18n();
    // 返回链接
    const back = document.querySelector('.back-link');
    if (back) back.textContent = mmI18n.t('common.exit');
  });
</script>
</body>
</html>
