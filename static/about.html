<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body>
<div class="container">
  <div class="take-header"><a href="/" class="back-link">← 返回</a></div>
  <div class="report-section">
    <h3>关于心镜</h3>
    <p style="color:var(--fg-muted);line-height:1.8">心镜 MindMirror 不是普通的问卷测评。它通过<strong style="color:var(--accent)">两难困境、时间压力、资源分配、内隐联想</strong>等多元方式,绕开自我美化,照见真实的你。</p>
    <p style="color:var(--fg-muted);line-height:1.8;margin-top:16px">三面镜子:</p>
    <ul style="color:var(--fg-muted);line-height:2;margin-left:20px">
      <li><strong style="color:var(--accent)">名人镜</strong> — 你与历史名人谁最相近</li>
      <li><strong style="color:var(--accent)">价值镜</strong> — 你的价值观与道德水平</li>
      <li><strong style="color:var(--accent)">意识镜</strong> — 你的意识形态定位</li>
    </ul>
  </div>
  <div class="report-section">
    <h3>数据与隐私</h3>
    <p style="color:var(--fg-muted);line-height:1.8">本测评完全匿名,仅以本地 token 关联你的记录。我们不收集任何身份信息。行为轨迹(决策耗时、修改次数)仅用于生成更准的报告,不会外传。</p>
    <p style="color:var(--fg-muted);line-height:1.8;margin-top:12px">本测评<strong style="color:var(--warn)">非心理诊断工具</strong>,结果仅供参考,不构成任何专业建议。</p>
  </div>
</div>
</body>
