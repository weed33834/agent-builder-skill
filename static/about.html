    `,
    sec_boundary: '境界と免責',
    boundary_body: `
      <p>心鏡は<strong>鏡であって、定規ではない</strong>。</p>
      <p>傾向を映し出すことはできても、医療診断を構成することはできません。思考を促すことはできても、専門相談の代わりにはなりません。性格は多次元かつ流動的であり、いかなる測評も一断面の投影に過ぎません。結果に不安を感じたなら、平常心で受け止めてください——鏡に映るのは、ある瞬間のあなたの投影であり、あなたのすべてではありません。</p>
      <p>名人マッチングは歴史人物の典型的行動特徴の評価に基づき、イデオロギーマッチングは古典理論の座標定位に基づきます。いずれも精密科学ではなく、自己探求と参考のためのものです。</p>
      <p style="margin-top:32px;color:var(--paper-faint);font-size:13px;letter-spacing:0.15em">— 鏡は語らず、ただ映す —</p>
    `,
  },
};

// 合并到全局 i18n 引擎
for (const lang of Object.keys(ABOUT_RES)) {
  if (!MM_I18N_RESOURCES[lang]) MM_I18N_RESOURCES[lang] = {};
  MM_I18N_RESOURCES[lang].about = ABOUT_RES[lang];
}

// 注:不要在这里调用 applyLang,i18n.js 的 initLang() 会在 DOMContentLoaded 时
// 读取 localStorage.mm_lang 并应用,过早调用会覆盖已保存语言,造成刷新丢失.

// 渲染三面镜子列表
function renderAboutLists() {
  const t = MM_I18N_RESOURCES[mmI18n.lang]?.about;
  if (!t) return;
  if (document.getElementById('mirror-list')) {
    document.getElementById('mirror-list').innerHTML = t.mirrors.map(m => `
      <li>
        <span class="mirror-list-icon">${m.icon}</span>
        <div>
          <div class="mirror-list-title">${m.title}</div>
          <div class="mirror-list-desc">${m.desc}</div>
        </div>
      </li>
    `).join('');
  }
  if (document.getElementById('method-grid')) {
    document.getElementById('method-grid').innerHTML = t.methods.map(m => `
      <div class="method-card">
        <div class="method-name">${m.name}</div>
        <div class="method-en">${m.en}</div>
        <div class="method-desc">${m.desc}</div>
      </div>
    `).join('');
  }
}
renderAboutLists();
injectLangSwitch();
// 切换语言时刷新镜子列表 + 网格(applyLang 已在 i18n.js 中处理 data-i18n 元素,
// 此处只需重渲动态拼出的 DOM)
document.addEventListener('mm:lang-changed', () => {
  renderAboutLists();
});
</script>
</body>
</html>
