<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mm-page" content="compare">
<title data-i18n="compare.title">关系对比 — 心镜</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container">
  <div class="take-header">
    <a href="/" class="back-link" data-i18n="common.back">← 返回</a>
  </div>
  <section class="bc-hero">
    <img src="/images/compare-mirrors.svg" class="compare-deco" alt="" width="180" aria-hidden="true">
    <div class="bc-eyebrow">COMPARE</div>
    <h1 class="bc-title" data-i18n="compare.title">关系对比</h1>
    <p class="bc-select-sub" data-i18n="compare.sub"></p>
  </section>
  <div class="compare-box">
    <input id="code" class="compare-input" type="text" data-i18n-placeholder="compare.placeholder" placeholder="粘贴对方的对比码" />
    <button class="btn-primary" id="btn-compare" type="button" data-i18n="compare.go">开始对比</button>
    <button class="btn-secondary" id="btn-copy" type="button" data-i18n="compare.copy_mine">复制我的对比码</button>
  </div>
  <p id="compare-msg" class="compare-msg"></p>
  <div id="compare-result"></div>
</div>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script src="/compare.js"></script>
<script>injectLangSwitch();</script>
</body>
</html>
