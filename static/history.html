<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mm-page" content="history">
<title data-i18n="history.title">镜中影像 — 心镜 MindMirror</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container">

  <div class="take-header">
    <a href="/" class="back-link" data-i18n="common.back">← 返回</a>
    <span class="title-label" data-i18n="history.title">镜中影像</span>
  </div>

  <header class="history-hero">
    <div class="mirror-disc"></div>
    <h1 data-i18n="history.hero_title">曾照见</h1>
    <p class="subtitle" data-i18n="history.hero_sub">Visions Past</p>
    <p class="disclaimer" data-i18n="history.hero_disc">每一次凝视,皆留下一道影像</p>
  </header>

  <div id="list" class="history-list">
    <!-- 加载态占位 -->
    <div class="history-loading">
      <div class="mirror-disc"></div>
      <p data-i18n="common.loading">加载中…</p>
    </div>
  </div>

</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
  function typeLabel(t) { return mmI18n.t(`history.type_labels.${t}`) || t; }

  // HTML 转义 —— 防止服务端历史数据(摘要、ID、类型等)注入 XSS
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function render() {
    const el = document.getElementById('list');
    let list;
    try {
      list = await api.get('/api/me/results');
    } catch (e) {
      el.innerHTML = `<div class="empty-state"><p data-i18n="common.error_generic">出现了一点意外</p></div>`;
      applyLang(mmI18n.lang);
      return;
    }
    if (!list.length) {
      el.innerHTML = `
        <div class="empty-state">
          <p style="font-family:var(--font-serif);font-size:18px;letter-spacing:0.15em;color:var(--paper-dim);margin-bottom:8px" data-i18n="common.mirror_unused">镜面尚未启用</p>
          <p style="font-size:13px;letter-spacing:0.2em;margin-bottom:32px" data-i18n="common.mirror_unused_sub">你的第一次凝视将在此留影</p>
          <a href="/" class="btn-primary" data-i18n="history.enter">入镜 →</a>
        </div>`;
      applyLang(mmI18n.lang);
      return;
    }
    el.innerHTML = list.map((r, i) => {
      const d = new Date(r.created_at);
      const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
      const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      return `
      <div class="history-item" style="animation-delay:${0.1 + i*0.06}s">
        <a href="/report.html?id=${escapeHtml(r.id)}" class="history-main">
          <div class="history-idx"><span class="num">${String(i+1).padStart(2,'0')}</span></div>
          <div class="history-body">
            <div class="history-summary">${escapeHtml(r.summary)}</div>
            <div class="history-meta">
              <span class="meta-type">${escapeHtml(typeLabel(r.assessment_type))}</span>
              <span class="meta-sep">·</span>
              <span class="meta-date">${dateStr}</span>
              <span class="meta-sep">·</span>
              <span class="meta-time">${timeStr}</span>
            </div>
          </div>
          <span class="history-arrow">→</span>
        </a>
        <a href="/take.html?type=${escapeHtml(r.assessment_type)}" class="history-retake" title="${escapeHtml(mmI18n.t('history.retake_hint'))}">${escapeHtml(mmI18n.t('history.retake'))}</a>
      </div>`;
    }).join('');
  }
  render();
  injectLangSwitch();
  // 语言切换时重新渲染(类型标签 + 复测按钮)
  document.addEventListener('mm:lang-changed', () => render());
</script>
</body>
</html>
