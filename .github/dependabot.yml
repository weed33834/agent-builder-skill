version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/templates/backend"
    schedule: { interval: "weekly" }
    labels: ["dependencies"]
    groups:
      # Bundle minor/patch bumps of the same ecosystem into one PR to avoid
      # dependabot flooding (4+ open PRs observed in Aug 2026).
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/templates/frontend"
    schedule: { interval: "weekly" }
    labels: ["dependencies"]
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies"]
