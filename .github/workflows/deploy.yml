name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许同时只有一份部署在跑,新的取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (project-site base /mindmirror/)
        run: npm run build
        env:
          # GitHub Pages 项目站点:https://<user>.github.io/mindmirror/,资源需带该前缀
          VITE_BASE: /mindmirror/

      - name: SPA fallback for GitHub Pages
        # GitHub Pages 对未知路径返回 404;复制 index.html 为 404.html,
        # 让客户端路由(BrowserRouter)接管 /figures、/take/:type 等深链。
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
