name: Sync to Gitee & GitCode

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Gitee
        run: |
          git remote add gitee https://badhope:${{ secrets.GITEE_TOKEN }}@gitee.com/badhope/mindmirror.git
          git push -f gitee main

      - name: Sync to GitCode
        run: |
          git remote add gitcode https://badhope:${{ secrets.GITCODE_TOKEN }}@gitcode.com/badhope/mindmirror.git
          git push -f gitcode main