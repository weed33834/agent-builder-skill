<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="ln-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <radialGradient id="ln-surface" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#2a1340"/>
      <stop offset="60%" stop-color="#180a28"/>
      <stop offset="100%" stop-color="#0a0414"/>
    </radialGradient>
  </defs>
  <!-- 外圈品红霓虹:发光层 -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#b8408b" stroke-width="3.2" filter="url(#ln-glow)" opacity="0.9"/>
  <!-- 外圈品红霓虹:清晰层 -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#b8408b" stroke-width="2"/>
  <!-- 镜面(深紫) -->
  <circle cx="32" cy="32" r="21" fill="url(#ln-surface)"/>
  <!-- 内圈青色辅光 -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#4a8b8b" stroke-width="0.8" opacity="0.55"/>
  <!-- 镜面高光弧 -->
  <path d="M18,22 Q24,15 34,16.5" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.45" stroke-linecap="round"/>
  <!-- 中央「镜」字篆意(衬线,品红发光) -->
  <text x="32" y="41" text-anchor="middle"
        font-family="'Noto Serif CJK SC','Source Han Serif SC','STSong','SimSun',Georgia,serif"
        font-size="22" font-weight="700" fill="#b8408b" filter="url(#ln-glow)" opacity="0.85">镜</text>
  <text x="32" y="41" text-anchor="middle"
        font-family="'Noto Serif CJK SC','Source Han Serif SC','STSong','SimSun',Georgia,serif"
        font-size="22" font-weight="700" fill="#f3d6ea">镜</text>
</svg>
