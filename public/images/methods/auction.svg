<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 拍卖:拍卖槌 -->
  <g stroke="#1a1714" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <!-- 拍卖槌头部(方形) -->
    <rect x="16" y="12" width="24" height="12" rx="1.5"/>
    <!-- 槌柄(倾斜) -->
    <line x1="38" y1="22" x2="52" y2="40"/>
    <!-- 底座(拍卖台) -->
    <line x1="14" y1="52" x2="50" y2="52"/>
    <!-- 击打线(三条放射线) -->
    <line x1="22" y1="6" x2="20" y2="2"/>
    <line x1="28" y1="6" x2="28" y2="2"/>
    <line x1="34" y1="6" x2="36" y2="2"/>
  </g>
</svg>
