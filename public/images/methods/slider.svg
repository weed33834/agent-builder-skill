<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 滑块:横线 + 圆点 -->
  <g stroke="#1a1714" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7">
    <!-- 横线 -->
    <line x1="10" y1="32" x2="54" y2="32"/>
    <!-- 两端小圆 -->
    <circle cx="10" cy="32" r="1.5" fill="#1a1714" stroke="none"/>
    <circle cx="54" cy="32" r="1.5" fill="#1a1714" stroke="none"/>
    <!-- 滑块手柄 -->
    <circle cx="36" cy="32" r="5" fill="#f8f5ee" stroke="#1a1714" stroke-width="1.5"/>
  </g>
</svg>
