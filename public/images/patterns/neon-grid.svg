<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="ng-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <linearGradient id="ng-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140a24"/>
      <stop offset="11%" stop-color="#1a0f2e"/>
      <stop offset="100%" stop-color="#0c0718"/>
    </linearGradient>
  </defs>
  <!-- 深紫底(顶部为天,留地平线) -->
  <rect width="400" height="400" fill="url(#ng-sky)"/>
  <!-- 地平线霓虹辉光(品红 + 青) -->
  <rect x="0" y="43" width="400" height="2" fill="#b8408b" filter="url(#ng-glow)" opacity="0.9"/>
  <rect x="0" y="44" width="400" height="1" fill="#b8408b"/>
  <rect x="0" y="47" width="400" height="1" fill="#4a8b8b" opacity="0.7"/>
  <!-- 透视纵线(品红,自地平线向下,可水平平铺) -->
  <path d="M0,44 V400 M40,44 V400 M80,44 V400 M120,44 V400 M160,44 V400 M200,44 V400 M240,44 V400 M280,44 V400 M320,44 V400 M360,44 V400 M400,44 V400"
        fill="none" stroke="#b8408b" stroke-width="1" opacity="0.8" filter="url(#ng-glow)"/>
  <path d="M0,44 V400 M40,44 V400 M80,44 V400 M120,44 V400 M160,44 V400 M200,44 V400 M240,44 V400 M280,44 V400 M320,44 V400 M360,44 V400 M400,44 V400"
        fill="none" stroke="#b8408b" stroke-width="0.6" opacity="0.85"/>
  <!-- 透视横线(青,越远越密,可水平平铺) -->
  <path d="M0,60 H400 M0,80 H400 M0,104 H400 M0,128 H400 M0,152 H400 M0,176 H400 M0,200 H400 M0,224 H400 M0,248 H400 M0,272 H400 M0,296 H400 M0,320 H400 M0,344 H400 M0,368 H400 M0,392 H400 M0,400 H400"
        fill="none" stroke="#4a8b8b" stroke-width="0.9" opacity="0.75" filter="url(#ng-glow)"/>
  <path d="M0,60 H400 M0,80 H400 M0,104 H400 M0,128 H400 M0,152 H400 M0,176 H400 M0,200 H400 M0,224 H400 M0,248 H400 M0,272 H400 M0,296 H400 M0,320 H400 M0,344 H400 M0,368 H400 M0,392 H400"
        fill="none" stroke="#4a8b8b" stroke-width="0.5" opacity="0.8"/>
</svg>
