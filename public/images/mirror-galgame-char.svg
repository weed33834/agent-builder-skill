<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <filter id="gc-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <linearGradient id="gc-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0f24"/>
      <stop offset="100%" stop-color="#15050f"/>
    </linearGradient>
  </defs>
  <!-- 取景框:品红霓虹描边(发光层+清晰层),角色画像主题 -->
  <rect x="6" y="5" width="36" height="38" rx="3" fill="#2a0f24" stroke="#ff2d95" stroke-width="2.2" filter="url(#gc-glow)" opacity="0.9"/>
  <rect x="6" y="5" width="36" height="38" rx="3" fill="none" stroke="#ff2d95" stroke-width="1.6"/>
  <!-- 内屏 -->
  <rect x="9" y="8" width="30" height="26" rx="2" fill="url(#gc-screen)" stroke="#a01e6a" stroke-width="1.1"/>
  <!-- 角色半身像:头部 + 肩膀轮廓(品红霓虹) -->
  <g fill="none" stroke="#ff2d95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#gc-glow)" opacity="0.9">
    <!-- 头 -->
    <circle cx="24" cy="19" r="5"/>
    <!-- 肩膀 -->
    <path d="M14 32 Q14 25 24 25 Q34 25 34 32"/>
  </g>
  <g fill="none" stroke="#ff6bb5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="19" r="5"/>
    <path d="M14 32 Q14 25 24 25 Q34 25 34 32"/>
  </g>
  <!-- 取景框四角准星(青) -->
  <g stroke="#00f0ff" stroke-width="1.4" stroke-linecap="round" fill="none" filter="url(#gc-glow)" opacity="0.85">
    <path d="M12 11 L12 8 L15 8"/>
    <path d="M33 8 L36 8 L36 11"/>
    <path d="M36 31 L36 34 L33 34"/>
    <path d="M15 34 L12 34 L12 31"/>
  </g>
  <!-- 心形匹配标记(品红,底部) -->
  <g fill="#ff2d95" filter="url(#gc-glow)" opacity="0.9">
    <path d="M24 38 q-2.2 -2 -2.2 -3.4 q0 -1 1 -1 q1 0 1.2 1 q0.2 -1 1.2 -1 q1 0 1 1 q0 1.4 -2.2 3.4 z"/>
  </g>
</svg>
